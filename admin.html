// [2026-09-26] 管理者向けパスキー（WebAuthn）ログイン 段階1
//   サーバは supabase/functions/auth-passkey（署名検証は @simplewebauthn/server）。
//   ブラウザ側は navigator.credentials を直接呼び、base64url の変換だけここで行う（署名検証はしない）。
//   @simplewebauthn/browser を使わないのは、外部ファイルの自己ホスト（deploy.ps1 のホワイトリスト追加）を避けるため。
//   PC は Windows Hello の PIN（顔・指紋が無くても可）、スマホは画面ロックで本人確認（userVerification=required）
// ══════════════════════════════════════════════════════════════
const PASSKEY_URL = `${SUPABASE_URL}/functions/v1/auth-passkey`;

// WebAuthn が使えるブラウザか（非対応ならボタン自体を出さない）
const passkeySupported = () =>
  !!(window.isSecureContext && window.PublicKeyCredential && navigator.credentials
     && navigator.credentials.create && navigator.credentials.get);

// 端末に合わせた呼び方（「このPC」「このスマホ」など）
function passkeyDevice() {
  const ua = navigator.userAgent || "";
  const isIPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (/iPhone/.test(ua)) return { kind:"スマホ", os:"iPhone" };
  if (isIPad) return { kind:"タブレット", os:"iPad" };
  if (/Android/.test(ua)) return { kind:/Mobile/.test(ua)?"スマホ":"タブレット", os:"Android" };
  if (/Windows/.test(ua)) return { kind:"PC", os:"Windows PC", hello:true };
  if (/Macintosh/.test(ua)) return { kind:"PC", os:"Mac" };
  return { kind:"PC", os:"PC" };
}
function passkeyWords() {
  const d = passkeyDevice();
  return {
    login: `この${d.kind}でログイン` + (d.hello ? "（Windows Hello）" : ""),
    register: `この${d.kind}を登録`,
    how: d.hello ? "Windows HelloのPIN（このPCだけで使う暗証番号）を入れるとログインできます"
       : d.kind === "PC" ? "このPCのパスワードや指紋でログインできます"
       : `この${d.kind}の画面ロック（指紋・顔・暗証番号）でログインできます`,
    // 端末名の初期値（例：Windows PC 9/26）。登録後に変えられる
    label: `${d.os} ${new Date().getMonth()+1}/${new Date().getDate()}`,
  };
}

// base64url ⇔ ArrayBuffer
function pkB64uToBuf(s) {
  const b64 = s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4);
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}
function pkBufToB64u(buf) {
  const u = new Uint8Array(buf);
  let bin = "";
  for (let i = 0; i < u.length; i++) bin += String.fromCharCode(u[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

// ブラウザのエラーを平易な日本語に
function passkeyErrorMessage(e, mode) {
  const n = e && e.name;
  const kind = passkeyDevice().kind;
  if (n === "NotAllowedError" || n === "AbortError") return "キャンセルされたか、時間切れになりました。もう一度押してください";
  if (n === "InvalidStateError") return mode === "register" ? `この${kind}はもう登録されています` : "もう一度押してください";
  if (n === "SecurityError") return "このアドレスでは使えません。https://shinsei-field-app.pages.dev/admin で開いてください";
  if (n === "NotSupportedError") return `この${kind}では使えません。PINでログインしてください`;
  return "うまくいきませんでした。もう一度押してください（" + (e && e.message || "不明なエラー") + "）";
}

// サーバ呼び出し。戻り値は常に { ok, error?, status, ... }（通信失敗も ok:false で返す）
async function passkeyCall(action, data = {}) {
  try {
    const r = await fetch(PASSKEY_URL, {
      method: "POST",
      headers: { "Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ action, ...data }),
    });
    const res = await r.json().catch(() => null);
    if (!res) return { ok:false, status:r.status, error:`通信エラー (${r.status})` };
    return { ...res, status:r.status };
  } catch (e) {
    return { ok:false, status:0, error:"通信できませんでした。電波やネットの状態を確認してください" };
  }
}

// 登録：サーバの options(JSON) → navigator.credentials.create → サーバへ返す JSON
async function passkeyCreate(opts) {
  const publicKey = {
    ...opts,
    challenge: pkB64uToBuf(opts.challenge),
    user: { ...opts.user, id: pkB64uToBuf(opts.user.id) },
    excludeCredentials: (opts.excludeCredentials || []).map(c => ({ ...c, id: pkB64uToBuf(c.id) })),
  };
  delete publicKey.hints; // 古いブラウザで未知のキーを嫌うことがあるため外す
  const cred = await navigator.credentials.create({ publicKey });
  const r = cred.response;
  return {
    id: cred.id, rawId: pkBufToB64u(cred.rawId), type: cred.type,
    response: {
      clientDataJSON: pkBufToB64u(r.clientDataJSON),
      attestationObject: pkBufToB64u(r.attestationObject),
      transports: typeof r.getTransports === "function" ? r.getTransports() : [],
    },
    clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {},
    authenticatorAttachment: cred.authenticatorAttachment || undefined,
  };
}

// ログイン：サーバの options(JSON) → navigator.credentials.get → サーバへ返す JSON
async function passkeyGet(opts) {
  const publicKey = {
    ...opts,
    challenge: pkB64uToBuf(opts.challenge),
    allowCredentials: (opts.allowCredentials || []).map(c => ({ ...c, id: pkB64uToBuf(c.id) })),
  };
  delete publicKey.hints;
  const cred = await navigator.credentials.get({ publicKey });
  const r = cred.response;
  return {
    id: cred.id, rawId: pkBufToB64u(cred.rawId), type: cred.type,
    response: {
      clientDataJSON: pkBufToB64u(r.clientDataJSON),
      authenticatorData: pkBufToB64u(r.authenticatorData),
      signature: pkBufToB64u(r.signature),
      userHandle: r.userHandle ? pkBufToB64u(r.userHandle) : undefined,
    },
    clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {},
    authenticatorAttachment: cred.authenticatorAttachment || undefined,
  };
}

// ログイン画面のボタン（未ログイン時）。成功したら PIN ログインと同じようにセッションを保存して onLoggedIn(user)
function PasskeyLoginButton({ onLoggedIn }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  if (!passkeySupported()) return null;
  const w = passkeyWords();
  const login = async () => {
    if (busy) return;
    setBusy(true); setErr("");
    try {
      const start = await passkeyCall("login_start");
      if (!start.ok) { setErr(start.error || "準備に失敗しました。もう一度押してください"); return; }
      let response;
      try { response = await passkeyGet(start.options); }
      catch (e) { setErr(passkeyErrorMessage(e, "login")); return; }
      const fin = await passkeyCall("login_finish", { challengeId: start.challengeId, response });
      if (!fin.ok || !fin.user || !fin.sessionToken) { setErr(fin.error || "ログインできませんでした。もう一度お試しください"); return; }
      if (fin.user.role !== "admin") { setErr("この方法でログインできるのは管理者だけです"); return; }
      setSessionToken(fin.sessionToken);
      saveSavedUser(fin.user);
      onLoggedIn(fin.user);
    } finally { setBusy(false); }
  };
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8,width:"100%",maxWidth:320}}>
      <button onClick={login} disabled={busy} style={{width:"100%",background:busy?"#e5e7eb":"linear-gradient(135deg,#f97316,#ef4444)",color:busy?"#6b7280":"#fff",border:"none",borderRadius:10,padding:"16px 20px",fontSize:16,fontWeight:700,cursor:busy?"wait":"pointer"}}>
        {busy ? "確認中…" : "🔑 " + w.login}
      </button>
      <div style={{fontSize:11,color:"#6b7280",textAlign:"center",lineHeight:1.6}}>{w.how}</div>
      {err && <div style={{fontSize:12,color:"#ef4444",textAlign:"center",lineHeight:1.6}}>{err}</div>}
    </div>
  );
}

// [2026-09-29] 管理者の「Googleでログイン」
//   サーバは supabase/functions/auth-google（IDトークンの署名検証・許可メールの照合・セッション発行）。
//   ボタンは Google 公式（Google Identity Services）。クライアントIDは auth-google の get_config で取る
//   （app_settings は anon で読めないため）。未設定ならボタン自体を出さない。
//   ※ 上の PasskeyLoginButton はログイン画面からは外した（設定タブの端末登録はそのまま残す）
// ══════════════════════════════════════════════════════════════
const GOOGLE_AUTH_URL = `${SUPABASE_URL}/functions/v1/auth-google`;

// サーバ呼び出し。戻り値は常に { ok, error?, status, ... }（通信失敗も ok:false で返す）
async function googleAuthCall(action, data = {}) {
  try {
    const r = await fetch(GOOGLE_AUTH_URL, {
      method: "POST",
      headers: { "Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ action, ...data }),
    });
    const res = await r.json().catch(() => null);
    if (!res) return { ok:false, status:r.status, error:`通信エラー (${r.status})` };
    return { ...res, status:r.status };
  } catch (e) {
    return { ok:false, status:0, error:"通信できませんでした。ネットの状態を確認してください" };
  }
}

// Google のスクリプトは必要な時だけ1回読み込む（未設定なら読み込まない）
let _gisPromise = null;
function loadGoogleScript() {
  if (window.google?.accounts?.id) return Promise.resolve();
  if (!_gisPromise) {
    _gisPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://accounts.google.com/gsi/client";
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { _gisPromise = null; reject(new Error("gsi load failed")); };
      document.head.appendChild(s);
    });
  }
  return _gisPromise;
}

// ログイン画面のボタン（未ログイン時）。成功したら PIN ログインと同じようにセッションを保存して onLoggedIn(user)
function GoogleLoginButton({ onLoggedIn }) {
  const [clientId, setClientId] = useState(null); // null=確認中 / ""=未設定（ボタンを出さない）
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const btnRef = useRef(null);
  const onCredentialRef = useRef(null);

  // Google から IDトークン（credential）が来たらサーバで確認してもらう
  onCredentialRef.current = async (resp) => {
    if (busy) return;
    if (!resp || !resp.credential) { setErr("Googleからの応答がありませんでした。もう一度お試しください"); return; }
    setBusy(true); setErr("");
    try {
      const res = await googleAuthCall("login", { credential: resp.credential });
      if (!res.ok || !res.user || !res.sessionToken) { setErr(res.error || "ログインできませんでした。もう一度お試しください"); return; }
      if (res.user.role !== "admin") { setErr("管理者だけがログインできます"); return; }
      setSessionToken(res.sessionToken);
      saveSavedUser(res.user);
      onLoggedIn(res.user);
    } finally { setBusy(false); }
  };

  // クライアントIDを取得（関数が未デプロイ・通信失敗の時もボタンを出さないだけ）
  useEffect(() => {
    let alive = true;
    (async () => {
      const r = await googleAuthCall("get_config");
      if (!alive) return;
      if (!r.ok) { console.warn("auth-google get_config:", r.error); setClientId(""); return; }
      setClientId(typeof r.clientId === "string" ? r.clientId : "");
    })();
    return () => { alive = false; };
  }, []);

  // 公式ボタンを描画
  useEffect(() => {
    if (!clientId) return;
    let alive = true;
    loadGoogleScript().then(() => {
      if (!alive || !btnRef.current || !window.google?.accounts?.id) return;
      window.google.accounts.id.initialize({
        client_id: clientId,
        callback: (r) => onCredentialRef.current && onCredentialRef.current(r),
        auto_select: false,          // 勝手にログインしない（必ずボタンを押す）
        cancel_on_tap_outside: true,
      });
      window.google.accounts.id.renderButton(btnRef.current, {
        type: "standard", theme: "outline", size: "small", text: "signin_with",
        shape: "rectangular", locale: "ja", // [2026-09-30] 目立たせない（small）
      });
    }).catch(() => {
      if (alive) setErr("Googleのボタンを読み込めませんでした。ネットの状態を確認して、画面を再読み込みしてください");
    });
    return () => { alive = false; };
  }, [clientId]);

  if (clientId === null) return null;              // 確認中
  if (clientId === "" && !err) return null;        // 未設定
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8,width:"100%",maxWidth:320}}>
      <div ref={btnRef} style={{minHeight:28,display:"flex",justifyContent:"center",opacity:busy?0.5:1,pointerEvents:busy?"none":"auto"}} />
      {busy && <div style={{fontSize:12,color:"#6b7280"}}>確認中…</div>}
      <div style={{fontSize:10,color:"#9ca3af",textAlign:"center",lineHeight:1.6}}>登録されたGoogleアカウントだけ入れます</div>
      {err && <div style={{fontSize:12,color:"#ef4444",textAlign:"center",lineHeight:1.6}}>{err}</div>}
    </div>
  );
}

// 設定タブ：この端末を登録・登録済み端末の一覧・名前変更・削除（自分のアカウントの分だけ）
function PasskeySettings({ showToast }) {
  const [list, setList] = useState(null);      // null=読み込み中
  const [loadErr, setLoadErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [canUse, setCanUse] = useState(null);  // この端末で本人確認（Windows Hello 等）が使えるか。null=確認中
  const [editId, setEditId] = useState(null);
  const [editLabel, setEditLabel] = useState("");
  const w = passkeyWords();
  const dev = passkeyDevice();

  // 401 は他のAPIと同じく「セッション切れ」扱いでログイン画面へ
  const handle401 = (res) => {
    if (res.status !== 401) return false;
    setSessionToken(null); saveSavedUser(null);
    if (typeof _sbSessionExpiredHandler === "function") _sbSessionExpiredHandler();
    return true;
  };
  const reload = async () => {
    const res = await passkeyCall("list", { token: _sessionToken });
    if (handle401(res)) return;
    if (!res.ok) { setLoadErr(res.error || "読み込みに失敗しました"); setList([]); return; }
    setLoadErr(""); setList(res.credentials || []);
  };
  useEffect(() => {
    reload();
    if (passkeySupported() && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
      PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(v => setCanUse(!!v)).catch(() => setCanUse(false));
    } else setCanUse(false);
  }, []);

  const register = async () => {
    if (busy) return;
    setBusy(true);
    try {
      const start = await passkeyCall("register_start", { token: _sessionToken });
      if (handle401(start)) return;
      if (!start.ok) { showToast("⚠ " + (start.error || "準備に失敗しました")); return; }
      let response;
      try { response = await passkeyCreate(start.options); }
      catch (e) { showToast("⚠ " + passkeyErrorMessage(e, "register")); return; }
      const fin = await passkeyCall("register_finish", { token: _sessionToken, challengeId: start.challengeId, response, deviceLabel: w.label });
      if (handle401(fin)) return;
      if (!fin.ok) { showToast("⚠ " + (fin.error || "登録に失敗しました")); return; }
      await reload();
      showToast(`✓ この${dev.kind}を登録しました。次回から「${w.login}」で入れます`);
    } finally { setBusy(false); }
  };

  const saveLabel = async (id) => {
    const label = editLabel.trim();
    if (!label) { showToast("⚠ 名前を入れてください"); return; }
    setBusy(true);
    const res = await passkeyCall("rename", { token: _sessionToken, id, deviceLabel: label });
    setBusy(false);
    if (handle401(res)) return;
    if (!res.ok) { showToast("⚠ " + (res.error || "保存に失敗しました")); return; }
    setEditId(null);
    await reload();
    showToast("✓ 名前を変えました");
  };

  const remove = async (c) => {
    const last = (list || []).length <= 1;
    const msg = last
      ? `「${c.deviceLabel}」は最後の1台です。\n削除すると、この方法ではログインできなくなります（PINでは今まで通り入れます）。\n本当に削除しますか？`
      : `「${c.deviceLabel}」を削除しますか？\nこの端末では「${w.login}」が使えなくなります。`;
    if (!window.confirm(msg)) return;
    setBusy(true);
    const res = await passkeyCall("delete", { token: _sessionToken, id: c.id });
    setBusy(false);
    if (handle401(res)) return;
    if (!res.ok) { showToast("⚠ " + (res.error || "削除に失敗しました")); return; }
    await reload();
    showToast("✓ 削除しました");
  };

  const fmt = (iso) => { if (!iso) return "—"; const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
  const btn = {border:"1px solid #d1d5db",background:"#fff",color:"#374151",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer"};

  return (
    <div style={{background:"#fafafa",border:"1px solid #f97316aa",borderRadius:8,padding:"14px",marginBottom:20}}>
      <div style={{fontSize:10,color:"#f97316",marginBottom:6,fontWeight:700}}>🔑 PINを使わずにログイン（Windows Hello・スマホの画面ロック）</div>
      <div style={{fontSize:11,color:"#374151",lineHeight:1.6,marginBottom:10}}>
        この{dev.kind}を登録すると、次回から「{w.login}」ボタンで入れます。PINでのログインも今まで通り使えます。
      </div>
      {/* [2026-09-29] ログイン画面は Googleログインに切り替え、「このPCでログイン」ボタンは出していない。登録画面だけ残している */}
      <div style={{fontSize:11,color:"#b45309",background:"#fef3c7",borderRadius:6,padding:"6px 8px",lineHeight:1.6,marginBottom:10}}>
        ※ 今はログイン画面に「{w.login}」ボタンを出していません（共用PCで誰でも押せてしまうため）。管理画面には「Googleでログイン」で入ってください。
      </div>
      {!passkeySupported() ? (
        <div style={{fontSize:11,color:"#6b7280"}}>このブラウザでは使えません。Microsoft Edge か Google Chrome で開いてください。</div>
      ) : canUse === false ? (
        <div style={{fontSize:11,color:"#b45309",lineHeight:1.7,background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:6,padding:"8px 10px"}}>
          {dev.hello
            ? <>このPCではまだWindows Helloが使えません。先に <b>設定 → アカウント → サインイン オプション → PIN (Windows Hello)</b> でPINを設定してから、この画面を開き直してください。</>
            : <>この{dev.kind}では画面ロック（指紋・顔・暗証番号）が設定されていないようです。先に設定してから、この画面を開き直してください。</>}
        </div>
      ) : (
        <button onClick={register} disabled={busy||canUse===null} style={{background:busy?"#e5e7eb":"linear-gradient(135deg,#f97316,#ef4444)",color:busy?"#9ca3af":"#fff",border:"none",borderRadius:8,padding:"10px 18px",fontSize:13,fontWeight:700,cursor:busy?"wait":"pointer"}}>
          {busy ? "…" : "＋ " + w.register}
        </button>
      )}

      <div style={{fontSize:10,color:"#6b7280",margin:"14px 0 6px",fontWeight:700}}>登録済みの端末</div>
      {list === null ? <div style={{fontSize:11,color:"#9ca3af"}}>読み込み中…</div>
       : loadErr ? <div style={{fontSize:11,color:"#ef4444"}}>{loadErr}</div>
       : list.length === 0 ? <div style={{fontSize:11,color:"#9ca3af"}}>まだありません</div>
       : list.map(c => (
        <div key={c.id} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:6,padding:"8px 10px",marginBottom:6}}>

// ══════════════════════════════════════════════════════════════
// [2026-09-30] 登録済み端末（社長PCなど）ログイン
//   Googleで入った管理者が設定タブで「この端末を登録」→ サーバ（auth-google register_device）が
//   1年有効の端末セッション（auth_method='device'）を発行し、この画面の保存トークンを入れ替える。
//   以後その端末は管理画面を開くだけで入れる（管理画面に独自の自動ログアウトは無い。401 の時だけログイン画面へ）。
//   端末セッションかどうかは保存ユーザーの authMethod:"device" で覚える（退出時の確認に使う）
// ══════════════════════════════════════════════════════════════
function isDeviceSession() {
  try { return JSON.parse(localStorage.getItem("shinsei_user") || "{}").authMethod === "device"; }
  catch (_) { return false; }
}

// 設定タブ：この端末を登録・登録済み端末の一覧・取り消し
function DeviceLoginSettings({ showToast, user }) {
  const [list, setList] = useState(null);         // null=読み込み中
  const [currentMethod, setCurrentMethod] = useState("");
  const [loadErr, setLoadErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [label, setLabel] = useState("社長PC");
  const [justRegistered, setJustRegistered] = useState(false);

  // 401 は他のAPIと同じく「セッション切れ」扱いでログイン画面へ
  const handle401 = (res) => {
    if (res.status !== 401) return false;
    setSessionToken(null); saveSavedUser(null);
    if (typeof _sbSessionExpiredHandler === "function") _sbSessionExpiredHandler();
    return true;
  };
  const reload = async () => {
    const res = await googleAuthCall("list_devices", { token: _sessionToken });
    if (handle401(res)) return;
    if (!res.ok) { setLoadErr(res.error || "読み込みに失敗しました"); setList([]); return; }
    setLoadErr(""); setCurrentMethod(res.currentAuthMethod || ""); setList(res.devices || []);
  };
  useEffect(() => { reload(); }, []);

  const register = async () => {
    if (busy) return;
    const name = label.trim() || "社長PC";
    if (!window.confirm(`この端末を「${name}」として登録します。\n登録すると、この端末では管理画面を開くだけで入れるようになります（1年間）。\n本人専用の端末だけにしてください。よろしいですか？`)) return;
    setBusy(true);
    try {
      const res = await googleAuthCall("register_device", { token: _sessionToken, deviceLabel: name });
      if (handle401(res)) return;
      if (!res.ok || !res.sessionToken) { showToast("⚠ " + (res.error || "登録に失敗しました")); return; }
      // 保存トークンを端末セッションに入れ替え（元の google セッションはサーバ側で削除済み）
      setSessionToken(res.sessionToken);
      saveSavedUser({ ...(user || {}), authMethod: "device" });
      setJustRegistered(true);
      await reload();
      showToast(`✓ 「${res.deviceLabel || name}」を登録しました`);
    } finally { setBusy(false); }
  };

  const revoke = async (d) => {
    const msg = d.isThisDevice
      ? `「${d.deviceLabel}」はこの端末です。\n取り消すと、この画面からすぐ退出します。取り消しますか？`
      : `「${d.deviceLabel}」の登録を取り消しますか？\nその端末では、次に開いた時からログイン画面になります。`;
    if (!window.confirm(msg)) return;
    setBusy(true);
    const res = await googleAuthCall("revoke_device", { token: _sessionToken, id: d.id });
    setBusy(false);
    if (handle401(res)) return;
    if (!res.ok) { showToast("⚠ " + (res.error || "取り消しに失敗しました")); return; }
    if (res.wasThisDevice) {
      setSessionToken(null); saveSavedUser(null);
      window.location.href = "/admin";
      return;
    }
    await reload();
    showToast("✓ 取り消しました");
  };

  const fmt = (iso) => { if (!iso) return "—"; const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
  const btn = {border:"1px solid #d1d5db",background:"#fff",color:"#374151",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer"};
  const canRegister = currentMethod === "google";

  return (
    <div style={{background:"#fafafa",border:"1px solid #2563ebaa",borderRadius:8,padding:"14px",marginBottom:20}}>
      <div style={{fontSize:10,color:"#2563eb",marginBottom:6,fontWeight:700}}>🖥 登録済み端末（開くだけで入れるPC）</div>
      <div style={{fontSize:11,color:"#374151",lineHeight:1.6,marginBottom:10}}>
        社長PCのような<b>本人専用の端末</b>を登録すると、その端末では管理画面を開くだけで入れます（1年間）。登録は「Googleでログイン」で入っている時だけできます。
      </div>

      {justRegistered ? (
        <div style={{fontSize:12,color:"#065f46",background:"#ecfdf5",border:"1px solid #6ee7b7",borderRadius:6,padding:"10px 12px",lineHeight:1.7,marginBottom:10}}>
          ✓ 登録しました。<b>このPCのブラウザからGoogleをログアウトしてください</b>（残っていると、この端末で他の人もGoogleで入れてしまいます）。<br/>
          <a href="https://accounts.google.com/Logout" target="_blank" rel="noopener noreferrer" style={{display:"inline-block",marginTop:6,background:"#2563eb",color:"#fff",borderRadius:6,padding:"6px 12px",fontWeight:700,textDecoration:"none"}}>Googleからログアウト（新しいタブ）</a>
        </div>
      ) : list === null ? null : canRegister ? (
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <input value={label} maxLength={30} onChange={e=>setLabel(e.target.value)} placeholder="社長PC" style={{flex:"1 1 140px",border:"1px solid #d1d5db",borderRadius:6,padding:"6px 8px",fontSize:16}}/>
          <button onClick={register} disabled={busy} style={{background:busy?"#e5e7eb":"#2563eb",color:busy?"#9ca3af":"#fff",border:"none",borderRadius:8,padding:"10px 14px",fontSize:13,fontWeight:700,cursor:busy?"wait":"pointer"}}>
            {busy ? "…" : "この端末を登録（ログインしたままにする）"}
          </button>
        </div>
      ) : (
        <div style={{fontSize:11,color:"#b45309",background:"#fef3c7",borderRadius:6,padding:"6px 8px",lineHeight:1.6}}>
          {currentMethod === "device"
            ? "この端末は登録済みです。"
            : "この端末を登録するには、一度「退出」して「Googleでログイン」で入り直してください。"}
        </div>
      )}

      <div style={{fontSize:10,color:"#6b7280",margin:"14px 0 6px",fontWeight:700}}>登録済みの端末</div>
      {list === null ? <div style={{fontSize:11,color:"#9ca3af"}}>読み込み中…</div>
       : loadErr ? <div style={{fontSize:11,color:"#ef4444"}}>{loadErr}</div>
       : list.length === 0 ? <div style={{fontSize:11,color:"#9ca3af"}}>まだありません</div>
       : list.map(d => (
        <div key={d.id} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:6,padding:"8px 10px",marginBottom:6,display:"flex",gap:6,alignItems:"center"}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,color:"#111827",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              {d.deviceLabel}{d.isThisDevice && <span style={{fontSize:10,color:"#2563eb",marginLeft:6}}>（この端末）</span>}
            </div>
            <div style={{fontSize:10,color:"#6b7280"}}>登録 {fmt(d.createdAt)} ／ 期限 {fmt(d.expiresAt)}{d.registeredBy ? ` ／ 登録した人 ${d.registeredBy}` : ""}</div>
          </div>
          <button disabled={busy} onClick={()=>revoke(d)} style={{...btn,color:"#ef4444",borderColor:"#fca5a5"}}>取り消す</button>
        </div>
      ))}
      <div style={{fontSize:10,color:"#9ca3af",marginTop:6,lineHeight:1.5}}>
        ※ PCをなくした・人に譲った時は、すぐここで「取り消す」を押してください。どの管理者の画面からでも取り消せます。
      </div>
    </div>
  );
}

      const data = await resp.json();

          社保・所得税・住民税はマネフォ側が計算するのでここでは扱わない。 */}
      {tab==="給与計算"&&(()=>{
        const [yr,mo] = payMonth.split("-").map(Number);
        const shoKey = n => `${payMonth}|${n}`;          // 職長手当は月ごとに保持する
        const prevMo = mo===1 ? 12 : mo-1;
        const prevYr = mo===1 ? yr-1 : yr;
        const periodStart = `${prevYr}-${String(prevMo).padStart(2,"0")}-26`;
        const periodEnd   = `${yr}-${String(mo).padStart(2,"0")}-25`;
        const sumDays = arr => arr.reduce((a,l)=>a+Number(l.days||0),0);
        const yen = n => "¥"+Number(n||0).toLocaleString();

        const rows = staff.filter(s=>s.role!=="admin").map(s=>{
          const m = getPayrollMaster(s.name);
          if(!m) return null;                       // 役員などマスタ未登録者は対象外
          // 承認済みの休日出勤のうち「買取希望」だけが手当の対象（振休希望は代休で消化）
          const lv = (leaveData[s.id]||[]).filter(l=>l.type==="holiday"&&l.status==="承認"&&l.date>=periodStart&&l.date<=periodEnd);
          const buy = t => sumDays(lv.filter(l=>l.holidayType===t&&l.holidayPref==="買取希望"));
          const sat = buy("saturday");              // 所定休日(土曜)
          // [2026-10-08] 法定休日(日曜)は振休を取っても割増分(0.35)＋上乗せ額を払うため、買取/振休を問わず数える
          //   以前は買取希望だけを数えていて、振休を取った法定休日出勤の手当が0円になっていた
          const sun = sumDays(lv.filter(l=>l.holidayType==="sunday"&&l.holidayPref!=="有給繰越"));
          // 長期休暇（お盆・年末年始）の出勤 → 夏季・冬季手当。
          // 有給繰越は 2026-07-22 に廃止済み（買取/振休の2択に統一）。それ以前の古いレコードだけ除外する。
          const long = sumDays(lv.filter(l=>(l.holidayType==="obon"||l.holidayType==="newyear")&&l.holidayPref!=="有給繰越"));
          // 残業は打刻から。夜勤は残業の概念がないので除外する
          const logs = clockLogs.filter(l=>l.userName===s.name&&l.clockOut&&!l.isNightShift
                                        &&dateStrJST(l.clockIn)>=periodStart&&dateStrJST(l.clockIn)<=periodEnd);
          // [2026-10-16] V3（2026年10月度〜）：1分単位の合計をそのまま渡し、月の丸め（30分未満切捨て・30分以上切上げ）は calcPayroll で行う
          const v3 = periodStart >= OVERTIME_RULE_V3_FROM;
          const otRaw = sumOvertimeH(logs);   // [2026-10-14] 早出の日は「実働−6.5H」
          const otH = v3 ? otRaw : Math.round(otRaw*10)/10;
          const days = new Set(logs.map(l=>dateStrJST(l.clockIn))).size;
          const p = calcPayroll(m, shokuchoMap[shoKey(s.name)]||0, {saturday:sat,sunday:sun,long}, otH, 0, v3 ? yr : null);
          // [2026-10-19] 本人都合の早上がりで「欠勤」を選んだ分（1分単位）を差し引く。単価は 基本給÷月平均所定（就業規則 第45条）
          const absMin = logs.reduce((a,l)=>a+absenceMinutesOfLog(l),0);
          const absDeduct = (v3 && p.avgH) ? Math.round(m.base / p.avgH * absMin / 60) : 0;
          const unchosen = logs.filter(l=>l.early_leave_category==="本人都合"&&!l.earlyLeavePay&&dateStrJST(l.clockIn)>="2026-10-19").length;

      {/* ═══ ダッシュボードタブ ═══ */}
      {/* [v15] 出勤簿タブ — 25日締め、ブラウザ印刷でPDF */}
      {tab==="出勤簿"&&(()=>{
        // 25日締め: attendMonth が "2026-03" なら 2/26〜3/25
        const [yr,mo] = attendMonth.split("-").map(Number);
        const prevMo = mo===1 ? 12 : mo-1;
        const prevYr = mo===1 ? yr-1 : yr;
        const periodStart = `${prevYr}-${String(prevMo).padStart(2,"0")}-26`;
        const periodEnd = `${yr}-${String(mo).padStart(2,"0")}-25`;
        const periodLabel = `${yr}年${mo}月度（${prevMo}/26〜${mo}/25）`; // [2026-06-22] 25日締め表記に変更
        // [2026-07-27] 編集・削除・承認後のリロードは「初期ロード90日」と「表示中期間の開始」の古い方から再取得
        //   （過去月表示中に90日分で上書きすると、せっかく追加取得した過去打刻がstateから消えるため）
        const clockReloadSinceIso = (()=>{const init=clockLogsInitialSinceIso();const p=new Date(`${periodStart}T00:00:00+09:00`).toISOString();return p<init?p:init;})();

        // 期間内の全日付リスト
        const allDates = [];
        const d = new Date(periodStart);
        const endD = new Date(periodEnd);
        while(d <= endD){ allDates.push(dateStrJST(d)); d.setDate(d.getDate()+1); } // [2026-05-07] Codex#3 UTC前日化を回避

        const printAttendance = (staffName) => {
          // [2026-07-09] XSS対策: 別ウィンドウへ document.write する生HTMLに、スタッフ/管理者の
          //   自由入力（備考・早上がり理由・現場名・会社名・作業員名等）をそのまま埋めていたため、
          //   <img onerror> 等を仕込まれると管理者が出勤簿を開いた瞬間に実行される恐れがあった。
          //   埋め込む前に必ず esc() でHTMLエスケープする。
          const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
          // [2026-04-27] clockIn は UTC ISO 文字列なので、JST 日付で range filter する（startsWith では日付がズレる）
          const logs = clockLogs.filter(l=>l.userName===staffName&&dateStrJST(l.clockIn)>=periodStart&&dateStrJST(l.clockIn)<=periodEnd);
          const targetStaff = staff.find(st=>st.name===staffName);
          const staffLeaves = targetStaff ? (leaveData[targetStaff.id]||[]).filter(l=>l.date>=periodStart&&l.date<=periodEnd) : [];
          const win = window.open("","_blank");
          if(!win) return;
          let rows = "";
          allDates.forEach(date=>{
            const dayName = ["日","月","火","水","木","金","土"][new Date(date).getDay()];
            const isWeekend = [0,6].includes(new Date(date).getDay());
            // [2026-04-27] UTC→JST変換して日付比較（startsWith だと UTC 日付が JST とズレる）
            const log = logs.find(l=>dateStrJST(l.clockIn)===date);
            // [2026-05-18] 同日複数 leave のうち買取希望(holiday)を優先検出
            const dayLeaves = staffLeaves.filter(l=>l.date===date);
            const leave = dayLeaves.find(l=>l.type==="holiday"&&l.holidayPref==="買取希望") || dayLeaves[0] || null;
            const isBuyoutDay = !!dayLeaves.find(l=>l.type==="holiday"&&l.holidayPref==="買取希望");
            // [2026-07-14] 夜勤フラグ。夜勤は定時概念なし→実働=退勤-出勤・残業0・退勤は日跨ぎで「翌」表示
            const isNight = !!log?.isNightShift;
            const clockIn = log ? (isNight?"🌙":"") + new Date(log.clockIn).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}) : "";
            const clockOut = log?.clockOut ? (isNight&&isCrossDayClock(log.clockIn,log.clockOut)?"翌":"") + new Date(log.clockOut).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}) : "";
            // [2026-04-21] 実働時間（休憩自動差し引き）と残業時間
            const worked = log?.clockOut ? (isNight?calcNightWorkedHours(log.clockIn,log.clockOut):calcWorkedHours(log.clockIn, log.clockOut)).toFixed(1) : "";
            const ot = log?.clockOut ? (isNight?0:overtimeOfLog(log, clockLogs)).toFixed(1) : "";
            const proj = log ? (projects.find(p=>p.id===log.projectId)?.name||"") : "";
            // [2026-05-18] holiday は希望区分（買取/振休/繰越）を付記。買取は強調
            const leaveType = leave ? (
              leave.type==="holiday"
                ? (leave.holidayPref==="買取希望" ? "休日出勤(買取)"
                  : leave.holidayPref==="振休希望" ? "休日出勤(振休)"
                  : leave.holidayPref==="有給繰越" ? "休日出勤(繰越)"
                  : (LEAVE_TYPES.find(t=>t.id===leave.type)?.label||"休日出勤"))
                : (LEAVE_TYPES.find(t=>t.id===leave.type)?.label||"")
            ) : "";
            const payLabel = log?.early_leave_category==="本人都合" ? (log.earlyLeavePay==="paid_leave"?"［時間有給］":log.earlyLeavePay==="absence"?"［欠勤］":"") : "";
            const note = [log?.note || "", log?.breakShortMin ? `休憩${log.breakShortMin}分取れず（${log.breakShortReason||""}）` : "", payLabel].filter(Boolean).join(" ");   // [2026-10-19]
            const earlycat = log?.early_leave_category || "";
            const earlyrsn = log?.early_leave_reason || "";
            // [2026-05-18] 買取希望の日は行をオレンジ系で強調
            // [2026-05-21] 土曜=水色 / 日曜（法定休日）=赤。打刻ありの「休日出勤」は濃トーンで目立たせる。
            const bg = isBuyoutDay ? "#fdba74"
              : dayName==="土" ? (log ? "#7dd3fc" : "#e0f2fe")
              : dayName==="日" ? (log ? "#fca5a5" : "#fee2e2")
              : "#fff";
            const earlyCatColor = {"現場終了":"#16a34a","会社都合":"#2563eb","本人都合":"#d97706"}[earlycat]||"";
            const leaveCellStyle = isBuyoutDay ? ` style="color:#c2410c;font-weight:700"` : "";
            rows += `<tr style="background:${bg}"><td>${date.slice(5)}</td><td>${dayName}</td><td>${clockIn}</td><td>${clockOut}</td><td style="text-align:right">${worked}</td><td style="text-align:right">${ot}</td><td>${esc(proj)}</td><td${leaveCellStyle}>${esc(leaveType)}</td><td style="color:${earlyCatColor};font-weight:${earlycat?"700":"400"}">${esc(earlycat)}${earlyrsn?` <span style="color:#111827;font-weight:400">(${esc(earlyrsn)})</span>`:""}</td><td>${esc(note)}</td></tr>`;
          });
          const completedLogs = logs.filter(l=>l.clockOut);
          // [2026-05-29] 出勤日数は JST 日付のユニーク数（同日複数現場の二重カウント防止）
          const totalDays = new Set(completedLogs.map(l=>dateStrJST(l.clockIn))).size;
          // [2026-07-14] 夜勤は実働=退勤-出勤、残業0で合計
          const totalWorked = completedLogs.reduce((s,l)=>s+(l.isNightShift?calcNightWorkedHours(l.clockIn,l.clockOut):calcWorkedHours(l.clockIn,l.clockOut)),0).toFixed(1);
          const totalOt = sumOvertimeH(completedLogs).toFixed(1);   // [2026-10-14] 早出の日は「実働−6.5H」（夜勤は0）
          // [2026-07-21] 夜間作業時間（夜勤ログの実働合計）— サマリー強調枠で表示
          const nightHours = completedLogs.filter(l=>l.isNightShift).reduce((s,l)=>s+calcNightWorkedHours(l.clockIn,l.clockOut),0).toFixed(1);
          // 早上がり集計
          const earlyLogs = completedLogs.filter(l=>l.early_leave_category);
          const earlyBycat = {};
          let earlyTotalH = 0;
          earlyLogs.forEach(l=>{
            const cat = l.early_leave_category;
            const d = new Date(l.clockOut);
            const earlyMins = 17*60 - (d.getHours()*60 + d.getMinutes());
            const r = earlyMins % 60;
            const h = r >= 30 ? Math.ceil(earlyMins/60) : Math.floor(earlyMins/60);
            earlyBycat[cat] = (earlyBycat[cat]||0) + 1;
            earlyTotalH += h;
          });

          // ── [2026-04-21] 出勤簿サマリ（再設計）
          // カテゴリ: 法定休日(日曜)出勤 / 所定休日(土曜)出勤 / 長期休暇(お盆・年末年始)出勤
          // 祝日は平日扱い（特別処理なし）
          const allLeaves = targetStaff ? (leaveData[targetStaff.id]||[]) : [];
          const HLABEL = { sunday:"日曜", saturday:"土曜", obon:"お盆", newyear:"年末年始" };

          // 有給残（leave_balances + 長期休暇による繰越）
          const lb = targetStaff ? leaveBalances.find(b=>b.staffId===targetStaff.id&&b.type==="paid") : null;
          const paidGranted = lb ? Number(lb.granted)+Number(lb.carried||0) : 0;
          const paidUsedDays = allLeaves.filter(l=>l.type==="paid"&&l.status==="承認").reduce((a,l)=>a+l.days,0);
          const paidRemain = paidGranted - paidUsedDays;

          // 振休消化済みの holiday_work_id セット
          const usedWorkIds = new Set(allLeaves.filter(l=>l.type==="furikae"&&l.holidayWorkId).map(l=>l.holidayWorkId));
          const nowTs = Date.now();
          const isNotExpired = w => nowTs <= addThreeMonths(w.date).getTime();

          // 承認済み休日出勤を種別ごとに分類
          // [2026-06-22] 買取希望・休日出勤一覧は25日締め期間（前月26日〜当月25日）に限定
          const approvedHoliday = allLeaves.filter(l=>l.type==="holiday"&&l.status==="承認"&&l.date>=periodStart&&l.date<=periodEnd);
          const sundayWorks = approvedHoliday.filter(l=>l.holidayType==="sunday");
          const saturdayWorks = approvedHoliday.filter(l=>l.holidayType==="saturday");
          const longWorks = approvedHoliday.filter(l=>l.holidayType==="obon"||l.holidayType==="newyear");

          // 土曜買取（締め期間内）
          const saturdayBuyouts = saturdayWorks.filter(l=>l.holidayPref==="買取希望");

          const approvedHolidayAll = allLeaves.filter(l=>l.type==="holiday"&&l.status==="承認");
          const furikaeRemainAll = approvedHolidayAll.filter(l=>(l.holidayType==="sunday"||l.holidayType==="saturday")&&l.holidayPref==="振休希望"&&!usedWorkIds.has(l.id)&&isNotExpired(l));
          // 長期休暇の有給繰越
          const longCarry = longWorks.filter(l=>l.holidayPref==="有給繰越");
          const longCarryDays = longCarry.reduce((a,l)=>a+Number(l.days||0),0);

          const sumDays = arr => arr.reduce((a,l)=>a+Number(l.days||0),0);
          // [2026-07-21] 土曜買取日数（締め期間内）— サマリー強調枠で表示
          const satBuyoutDays = sumDays(saturdayBuyouts);

          const furikaeSummaryHtml = (()=>{
            let html = `<div class="furikae-box">`;

            if (sundayWorks.length > 0) {
              html += `<div class="fcat">■ 法定休日出勤（日曜）</div>`;

            }
            // ■ 振替休日残（累計）— [2026-06-22] 期間に依らず未消化の振替休日を常に表示（累計残高）
            const furikaeRemainDays = sumDays(furikaeRemainAll);

                if(adminSpecFile){
                  fileUrl=await uploadFileDirect(adminSpecFile.rawFile)||"";
                  if(!fileUrl){setAdminSpecUploading(false);showToast("⚠ PDFのアップロードに失敗");return;}
                }
                setAdminSpecUploading(false);
                const spec={projectId:dp.id,fileName:adminSpecForm.fileName||adminSpecFile?.name||"",fileUrl,specText:adminSpecForm.specText,uploadedBy:user.name};
                const ok=await upsertProjectSpec(spec);
                if(!ok){showToast(WRITE_ERROR_MSG);return;}
                const refreshed=await loadProjectSpecs();
                setProjectSpecs(refreshed||[]);
                setAdminSpecFile(null);setModal("projDetail");showToast("✓ 仕様書を追加しました");
              })} disabled={!hasContent||busy||adminSpecUploading} style={{background:(hasContent&&!busy&&!adminSpecUploading)?"linear-gradient(135deg,#60a5fa,#3b82f6)":"#e5e7eb",color:(hasContent&&!busy&&!adminSpecUploading)?"#000":"#9ca3af",border:"none",borderRadius:8,padding:"13px",fontSize:14,fontWeight:700,cursor:(hasContent&&!busy&&!adminSpecUploading)?"pointer":"not-allowed"}}>{adminSpecUploading?"アップロード中…":busy?"送信中…":"追加する"}</button>
            </div>
          </Modal>
        );
      })()}

      {/* 案件詳細ライトボックス */}
      {detailLightboxImg&&(
        <div onClick={()=>setDetailLightboxImg(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16,cursor:"zoom-out"}}>
          <img src={detailLightboxImg} alt="拡大" style={{maxWidth:"100%",maxHeight:"100%",borderRadius:8,objectFit:"contain"}}/>
          <button onClick={()=>setDetailLightboxImg(null)} style={{position:"absolute",top:16,right:16,background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",fontSize:20,borderRadius:"50%",width:36,height:36,cursor:"pointer",lineHeight:"36px",textAlign:"center"}}>✕</button>
        </div>
      )}

    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AdminApp));
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      // [2026-04-17] 1時間ごとに更新チェック
      setInterval(() => reg.update().catch(()=>{}), 60*60*1000);
      // 新SW見つかったら即アクティベート
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        if (!newSW) return;
        newSW.addEventListener('statechange', () => {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            newSW.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(() => {});
    // SWから「更新しました」通知を受けたら自動リロード
    let reloaded = false;
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data?.type === 'SW_UPDATED' && !reloaded) {
        reloaded = true;
        setTimeout(() => window.location.reload(), 500);
      }
    });
    // controllerchange: 新SWが制御を取ったら自動リロード
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!reloaded) { reloaded = true; window.location.reload(); }
    });
  });
}
  </script>
