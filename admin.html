// ── SUB-COMPONENTS ──
function EarlyLeaveTab({ clockLogs, staffList }) {
  const [elMonth, setElMonth] = useState(monthStr()); // [2026-05-07] Codex#3 UTC前月化バグ回避
  const earlyLogs = clockLogs.filter(l=>{
    if(!l.early_leave_category) return false;
    return (l.clockIn||"").slice(0,7)===elMonth;
  });
  const catColor={"現場終了":"#22c55e","会社都合":"#60a5fa","本人都合":"#f59e0b"};
  const staffSummary = (staffList||[]).reduce((acc,s)=>{
    const logs=earlyLogs.filter(l=>l.userId===s.id);
    if(logs.length===0) return acc;
    const honninHours=logs.filter(l=>l.early_leave_category==="本人都合"&&l.earlyLeavePay==="paid_leave")   // [2026-10-19] 本人が時間有給を選んだ分だけ
      .reduce((sum,l)=>{
        if(!l.clockOut) return sum;
        const d=new Date(l.clockOut);
        const earlyMins=17*60-d.getHours()*60-d.getMinutes();
        const r=earlyMins%60;
        return sum+(r>=30?Math.ceil(earlyMins/60):Math.floor(earlyMins/60));
      },0);
    acc.push({staff:s,logs,honninHours});
    return acc;
  },[]);
  return(
    <div style={{padding:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
        <div style={{fontSize:10,color:"#f97316",letterSpacing:"0.1em"}}>⏰ 早上がり一覧</div>
        <input type="month" value={elMonth} onChange={e=>setElMonth(e.target.value)}
          style={{background:"#fafafa",border:"1px solid #d1d5db",borderRadius:6,padding:"4px 8px",color:"#374151",fontSize:12}}/>
      </div>
      {earlyLogs.length===0
        ?<div style={{color:"#111827",textAlign:"center",padding:40}}>この月の早上がり記録はありません</div>
        :(
        <>
          <div style={{marginBottom:20}}>
            {[...earlyLogs].sort((a,b)=>a.clockIn>b.clockIn?-1:1).map(l=>(
              <div key={l.id} style={{background:"#fafafa",border:"1px solid #e5e7eb",borderRadius:8,padding:"10px 12px",marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <span style={{fontSize:12,fontWeight:700,color:"#374151"}}>{l.userName}</span>
                  <span style={{fontSize:10,color:"#6b7280"}}>{(l.clockIn||"").slice(0,10)}</span>
                </div>
                <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:10,background:(catColor[l.early_leave_category]||"#6b7280")+"22",color:catColor[l.early_leave_category]||"#6b7280"}}>{l.early_leave_category}</span>
                  <span style={{fontSize:11,color:"#4b5563"}}>退勤: {l.clockOut?new Date(l.clockOut).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}):"—"}</span>
                  {l.early_leave_category==="本人都合"&&<span style={{fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:8,background:l.earlyLeavePay?"#fef3c7":"#fee2e2",color:l.earlyLeavePay?"#b45309":"#dc2626"}}>{l.earlyLeavePay==="paid_leave"?"時間有給":l.earlyLeavePay==="absence"?"欠勤（給料から引く）":"扱い未選択"}</span>}
                </div>
                {l.early_leave_reason&&<div style={{fontSize:11,color:"#6b7280",marginTop:4}}>理由: {l.early_leave_reason}</div>}
              </div>
            ))}
          </div>
          <div style={{fontSize:10,color:"#111827",letterSpacing:"0.1em",marginBottom:10}}>■ スタッフ別サマリ</div>
          {staffSummary.map(({staff,logs,honninHours})=>(
            <div key={staff.id} style={{background:"#e5e7eb",border:"1px solid #fafafa",borderRadius:8,padding:"10px 12px",marginBottom:8}}>
              <div style={{fontSize:12,fontWeight:700,color:"#374151",marginBottom:6}}>{staff.name}</div>
              <div style={{display:"flex",gap:12,fontSize:11,color:"#6b7280",flexWrap:"wrap"}}>
                <span>計 {logs.length} 件</span>
                {["現場終了","会社都合","本人都合"].map(c=>{
                  const n=logs.filter(l=>l.early_leave_category===c).length;
                  return n>0?<span key={c} style={{color:catColor[c]}}>{c}: {n}件</span>:null;
                })}
                {honninHours>0&&<span style={{color:"#fbbf24"}}>時間有給消化: {honninHours}h</span>}
              </div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

// ──────────────────────────────
// [2026-10-02] お金タブ（資金繰り・売上見込み・損益分岐・返済）
//   売上見込みは「請負額×進捗%」の出来高。過去は進捗報告の差分、未来は残りを工期末まで均等に割る。
//   入金＝出来高を客先ごとの入金タイミング（既定：翌月）だけ後ろにずらす。金額はすべて税抜・円。
//   手入力は finance_data（key='main'）の1行だけ：固定費・変動費率・借入・通帳残高・客先の入金タイミング
// ──────────────────────────────
const FIN_DEFAULT = { fixedCost: 4630000, variableRate: 0.37, defaultLag: 1, clientLags: {}, loans: [], cash: [] };
const finKey = d => { const j = new Date(new Date(d).getTime() + 9*3600000); return j.getUTCFullYear() + "-" + String(j.getUTCMonth()+1).padStart(2,"0"); };
const finAdd = (k, n) => { const [y,m] = k.split("-").map(Number); const d = new Date(Date.UTC(y, m-1+n, 1)); return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0"); };
const finLabel = k => Number(k.slice(5)) + "月";
const finMan = n => (Math.round((n||0)/10000)).toLocaleString(); // 万円表示

// 進捗%：進捗報告があればそれ、無ければ人工の消化率から推定（最大95%）。完了は100%
function finProgress(p, reports, cost) {
  if (p.status === "完了") return { pct: 100, est: false };
  const r = getLatestProgress(p, reports);
  if (r) return { pct: r, est: false };
  const c = cost?.consumePct;
  return { pct: c ? Math.min(95, c) : 0, est: true };
}

// 案件ごとの月別出来高 { "2026-10": 円 }
//   済んだ分（請負×進捗%）は、月ごとの人工（打刻＋応援）の割合で過去の月に配る。打刻が無ければ今月に置く
//   残り（請負×(100−進捗%)）は、今月（未着工なら開始月）〜工期末月に均等割り
function finProjectMonthly(p, reports, nowKey, logs, cost) {
  const amt = Number(p.contractAmount) || 0;
  const out = {};
  if (amt <= 0 || p.status === "中止") return out;
  const prog = finProgress(p, reports, cost).pct;
  const done = amt * prog / 100;
  const md = {}; let mdSum = 0;
  (logs || []).forEach(l => {
    if (l.projectId !== p.id || !l.clockOut) return;
    const n = 1 + (l.outsourceType === "support" ? Number(l.outsourceCount) || 0 : 0);
    const k = finKey(l.clockIn); md[k] = (md[k] || 0) + n; mdSum += n;
  });
  if (done > 0) {
    if (mdSum > 0) Object.keys(md).forEach(k => { out[k] = (out[k] || 0) + done * md[k] / mdSum; });
    else { const k = p.status === "完了" && p.completedAt ? finKey(p.completedAt) : nowKey; out[k] = (out[k] || 0) + done; }
  }
  if (p.status === "完了" || prog >= 100) return out;
  // 未来：工期末なし→3か月、工期末を過ぎている→今月と来月の2か月
  let from = nowKey;
  if (p.startDate && finKey(p.startDate) > nowKey) from = finKey(p.startDate);
  let to = p.endDate ? finKey(p.endDate) : finAdd(from, 2);
  if (to < from) to = finAdd(from, 1);
  const prev = prog;
  const months = []; for (let k = from; k <= to && months.length < 36; k = finAdd(k, 1)) months.push(k);
  const each = amt * (100 - prev) / 100 / months.length;
  months.forEach(k => { out[k] = (out[k] || 0) + each; });
  return out;
}

// その月の借入返済合計
function finLoanPay(loans, k) {
  return (loans || []).reduce((s, l) => {
    const st = l.startMonth || "2000-01", en = l.endMonth || "2099-12";
    return (k >= st && k <= en) ? s + (Number(l.monthly) || 0) : s;
  }, 0);
}

// 全部まとめて計算する（画面はこれの結果を表示するだけ）
function finCalc(fin, projects, reports, costCtx) {
  const nowKey = finKey(new Date());
  const f = { ...FIN_DEFAULT, ...(fin || {}) };
  const vr = Number(f.variableRate) || 0, fixed = Number(f.fixedCost) || 0;
  const per = (projects || []).map(p => { const cost = calcProjectCost(p, costCtx);
    return { p, cost, m: finProjectMonthly(p, reports, nowKey, costCtx?.clockLogs, cost), lag: Number(f.clientLags?.[p.lead] ?? f.defaultLag) || 0 }; });
  const dk = k => per.reduce((s, x) => s + (x.m[k] || 0), 0);
  const inflow = k => per.reduce((s, x) => s + (x.m[finAdd(k, -x.lag)] || 0), 0);
  // 残高：最新の通帳残高の月から12か月
  const snaps = [...(f.cash || [])].sort((a,b) => (a.date < b.date ? -1 : 1));
  const snap = snaps[snaps.length - 1] || null;
  const baseKey = snap ? finKey(snap.date + "T00:00:00+09:00") : nowKey;
  let bal = snap ? Number(snap.available) || 0 : 0;
  const cf = [];
  for (let i = 0; i < 12; i++) {
    const k = finAdd(baseKey, i), d = dk(k), inc = inflow(k), vc = d * vr, rep = finLoanPay(f.loans, k);
    const out = fixed + vc + rep; bal += inc - out;
    cf.push({ k, dk: d, inc, fixed, vc, rep, out, diff: inc - out, bal });
  }
  // 赤黒：過去6か月〜先6か月（出来高ベース）
  const pl = [];
  for (let i = -6; i <= 5; i++) {
    const k = finAdd(nowKey, i), d = dk(k), mp = d * (1 - vr), rep = finLoanPay(f.loans, k);
    pl.push({ k, dk: d, mp, profit: mp - fixed, afterRepay: mp - fixed - rep, past: i < 0, now: i === 0 });
  }
  const repNow = finLoanPay(f.loans, nowKey);
  const breakeven = vr < 1 ? fixed / (1 - vr) : 0;
  const breakevenRepay = vr < 1 ? (fixed + repNow) / (1 - vr) : 0;
  // 楽になる月：返済が前月より減る最初の月（36か月先まで）
  let easier = null;
  for (let i = 1; i <= 36; i++) {
    const k = finAdd(nowKey, i), a = finLoanPay(f.loans, finAdd(k, -1)), b = finLoanPay(f.loans, k);
    if (b < a) { easier = { k, before: a, after: b }; break; }
  }
  // 現場ごと（進行中・準備中）
  const active = per.filter(x => ["進行中","準備中"].includes(x.p.status));
  const pj = active.map(({ p, m, lag, cost }) => {
    const amt = Number(p.contractAmount) || 0, pr = finProgress(p, reports, cost), prog = Math.round(pr.pct);
    return { p, amt, prog, est: pr.est, nowDk: m[nowKey] || 0, remain: amt * (100 - pr.pct) / 100, lag, cost };
  }).sort((a,b) => b.amt - a.amt);
  const backlog = pj.reduce((s, x) => s + x.remain, 0);
  const next3 = [0,1,2].reduce((s, i) => s + dk(finAdd(nowKey, i)), 0);
  // 要注意
  const today = new Date().toISOString().slice(0,10);
  const alerts = [];
  pj.forEach(x => {
    const n = x.p.name;
    if (x.amt <= 0) alerts.push({ lv: "y", t: `${n}：請負額が未入力（売上見込みに入っていません）` });
    if (x.p.status === "進行中" && x.p.endDate && x.p.endDate < today) alerts.push({ lv: "r", t: `${n}：工期（${x.p.endDate}）を過ぎても進行中。請求漏れ・工期の確認を` });
    if (x.amt > 0 && x.est) alerts.push({ lv: "y", t: `${n}：進捗が未入力（人工から${x.prog}%と推定中）` });
    if (x.cost.status.level === "bad") alerts.push({ lv: "r", t: `${n}：人工の判定が赤字` });
    else if (x.cost.status.level === "warn") alerts.push({ lv: "y", t: `${n}：人工の判定が注意` });
  });
  const minRow = cf.reduce((a, b) => (b.bal < a.bal ? b : a), cf[0]);
  return { f, nowKey, snap, cf, pl, repNow, breakeven, breakevenRepay, easier, pj, backlog, next3, alerts, minRow, monthlyOut: fixed + repNow };
}

const FC = { bg:"#0b1020", card:"#121a2e", line:"#22304d", tx:"#e5e7eb", sub:"#8b9bb8", gold:"#fbbf24", g:"#22c55e", y:"#f59e0b", r:"#ef4444", v:"#a78bfa" };
const finCard = { background:FC.card, border:`1px solid ${FC.line}`, borderRadius:14, padding:16, marginBottom:14 };
const finH = { fontSize:13, color:FC.sub, fontWeight:700, margin:"0 0 10px", letterSpacing:1 };
const finTd = { padding:"7px 6px", borderBottom:`1px solid ${FC.line}`, textAlign:"right", whiteSpace:"nowrap" };
const finInput = { width:"100%", padding:10, background:"#0b1020", color:FC.tx, border:`1px solid ${FC.line}`, borderRadius:8, fontSize:14, boxSizing:"border-box" };

function FinBars({ rows, max, color, lines = [] }) {
  const mx = Math.max(max, 1);
  return (<div>
    <div style={{ display:"flex", alignItems:"flex-end", gap:4, height:170, position:"relative", borderBottom:`1px solid ${FC.line}`, marginTop:18 }}>
      {lines.map(([v, c, t], i) => <div key={i} style={{ position:"absolute", left:0, right:0, bottom:`${Math.min(100, v / mx * 100)}%`, borderTop:`2px dashed ${c}` }}><span style={{ position:"absolute", right:0, top:-16, fontSize:10, color:c }}>{t}</span></div>)}
      {rows.map((r, i) => <div key={i} style={{ flex:1, height:`${Math.max(2, Math.max(0, r.v) / mx * 100)}%`, background:color(r), borderRadius:"5px 5px 0 0", position:"relative", opacity:r.dim ? .55 : 1 }}>
        <span style={{ position:"absolute", top:-15, left:-4, right:-4, textAlign:"center", fontSize:9, color:FC.sub }}>{finMan(r.v)}</span></div>)}
    </div>
    <div style={{ display:"flex", gap:4 }}>{rows.map((r, i) => <div key={i} style={{ flex:1, textAlign:"center", fontSize:10, color:r.hl ? FC.gold : FC.sub, fontWeight:r.hl ? 800 : 400 }}>{r.label}</div>)}</div>
  </div>);
}

// [2026-10-15] 出面表：日付ごとに、どの現場に誰が行ったか（打刻から自動）。🚗社用車・🚙自家用・🚃電車は出勤時の通勤方法
// [2026-10-22] 25日締め（出勤簿と同じ）："2026-03" なら 2/26〜3/25。今日が26日以降なら翌月度を最初に出す
function DailySiteTable({ clockLogs, projects }) {
  const pad2 = n => String(n).padStart(2,"0");
  const [ym, setYm] = useState(() => { const n = new Date(); const t = new Date(n.getFullYear(), n.getMonth() + (n.getDate() >= 26 ? 1 : 0), 1); return `${t.getFullYear()}-${pad2(t.getMonth()+1)}`; });
  const [y, m] = ym.split("-").map(Number);
  const dates = [];
  for (let d = new Date(y, m-2, 26); d <= new Date(y, m-1, 25); d.setDate(d.getDate()+1)) dates.push(new Date(d));
  const dstr = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const dset = new Set(dates.map(dstr));
  const COMMUTE = { company_car:"🚐", company_car_shared:"👥", own_car:"🚗", train:"🚃" };   // 出勤時の通勤方法（社用車＝運転・相乗り＝同乗）
  const logs = clockLogs.filter(l => dset.has(dateStrJST(l.clockIn)));
  const pids = [...new Set(logs.map(l => l.projectId))];
  const pname = id => (projects.find(p => p.id === id) || {}).name || "（削除された現場）";
  pids.sort((a, b) => logs.filter(l => l.projectId === b).length - logs.filter(l => l.projectId === a).length);
  const cell = (date, pid) => {
    const seen = new Map();
    for (const l of logs) if (l.projectId === pid && dateStrJST(l.clockIn) === date && !seen.has(l.userId)) seen.set(l.userId, l);
    return [...seen.values()];
  };
  const shift = d => { const t = new Date(y, m - 1 + d, 1); setYm(`${t.getFullYear()}-${pad2(t.getMonth()+1)}`); };
  const W = ["日","月","火","水","木","金","土"];
  const th = { position:"sticky", top:0, background:"#f3f4f6", border:"1px solid #d1d5db", padding:"6px 8px", fontSize:11, whiteSpace:"nowrap", zIndex:1 };
  const td = { border:"1px solid #e5e7eb", padding:"4px 6px", fontSize:11, verticalAlign:"top", minWidth:90 };
  return (
    <div style={{padding:12}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
        <button onClick={()=>shift(-1)} style={{padding:"4px 10px"}}>◀</button>
        <div style={{fontSize:15,fontWeight:700}}>{y}年{m}月度の出面表<span style={{fontSize:11,fontWeight:400,color:"#6b7280",marginLeft:6}}>{dates[0].getMonth()+1}/26〜{m}/25</span></div>
        <button onClick={()=>shift(1)} style={{padding:"4px 10px"}}>▶</button>
        <div style={{fontSize:10,color:"#6b7280",marginLeft:8}}>🚐社用車（運転） 👥相乗り 🚗自車 🚃電車（出勤時の通勤方法）</div>
      </div>
      {pids.length === 0 ? <div style={{fontSize:12,color:"#6b7280"}}>この月の打刻はありません</div> :
      <div style={{overflow:"auto",maxHeight:"70vh",border:"1px solid #d1d5db",borderRadius:8,background:"#fff"}}>
        <table style={{borderCollapse:"collapse",width:"100%"}}>
          <thead><tr><th style={{...th,left:0,zIndex:2}}>日付</th>{pids.map(pid=><th key={pid} style={th}>{pname(pid)}</th>)}</tr></thead>
          <tbody>
            {dates.map(dt=>{
              const date = dstr(dt);
              const wd = dt.getDay();
              const label = `${dt.getMonth()+1}/${dt.getDate()}`;
              const cells = pids.map(pid => cell(date, pid));
              if (cells.every(c => c.length === 0)) return (
                <tr key={date}><td style={{...td,position:"sticky",left:0,background:"#fafafa",color:wd===0?"#ef4444":wd===6?"#2563eb":"#9ca3af"}}>{label}（{W[wd]}）</td>{pids.map(pid=><td key={pid} style={{...td,background:"#fafafa"}}/>)}</tr>);
              return (
                <tr key={date}>
                  <td style={{...td,position:"sticky",left:0,background:"#fff",fontWeight:700,color:wd===0?"#ef4444":wd===6?"#2563eb":"#111827"}}>{label}（{W[wd]}）</td>
                  {cells.map((c,k)=><td key={pids[k]} style={td}>{c.map(l=><div key={l.userId}>{COMMUTE[l.commuteMethod]||""}{l.userName}</div>)}</td>)}
                </tr>);
            })}
            <tr>
              <td style={{...td,position:"sticky",left:0,background:"#f3f4f6",fontWeight:700}}>のべ人数</td>
              {pids.map(pid=>{
                let n = 0;
                for (const dt of dates) n += cell(dstr(dt), pid).length;
                return <td key={pid} style={{...td,background:"#f3f4f6",fontWeight:700}}>{n}人</td>;
              })}
            </tr>
          </tbody>
        </table>
      </div>}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// [2026-10-15] 原価表タブ：社長の Excel「☆☆NEW原価表」を自動集計。数値は画面で直せる（finance_data key='genka' に保存）
//   ・1人工の単価 ＝（年収 × (1 ＋ 会社負担の社保率)）÷ 年間出勤日数（打刻から。直せる）
//   ・諸経費 ＝ 受注 × 諸経費率（Excel と同じく原価に含める）。実行予算 ＝ 受注 − 諸経費、実行予算の人工 ＝ 実行予算 ÷ 1人工の予算単価
//   ・交通費・諸手当は日ごとに手入力（交通費の自動推定は次の段階）
// ══════════════════════════════════════════════════════
const GENKA_DEFAULT = {
  people: [
    { name:"裕太", annual:7200000 }, { name:"川畑", annual:6500000 }, { name:"大塚", annual:5200000 },
    { name:"小野", annual:4500000 }, { name:"廣野", annual:5000000 },
  ],
  insuranceRate: 0.16,   // 会社負担の社会保険の率（試算表：法定福利費 ÷ 給与等 で直す）
  overheadRate: 0.23,    // 諸経費率（Excel と同じ）
  budgetUnit: 30000,     // 実行予算の 1 人工あたりの単価（Excel と同じ）
  overtimeRate: 1.25,    // 残業の割増
  standardDays: 240,     // 打刻が少ない人（裕太など現場外の仕事が多い人）の年間出勤日数
  workdays: {},          // 人ごとの年間出勤日数の上書き（空なら打刻から）
  days: {},              // [projectId][YYYY-MM-DD] = { transport, allowance, note, mandays:{名前:人工} }
  transport: {},   // 交通費の推定の設定（家・会社の位置、ガソリン、高速）。空なら TRANSPORT_DEFAULT（下で定義）を使う
};
// ── [2026-10-15] 交通費の自動推定（勝間さんと決めた 3 つ） ──
//   ① 同じ日・同じ現場で、社用車（または未選択）で出勤した人は 1 台で相乗り。会社（川畑さん宅）から出て、小野さんが乗る日は蒲生で拾う。
//      会社まで自分の車で来る人（大塚・廣野など）の往復のガソリン代も入れる
//   ② 自家用車で 1 人で来た人は直行直帰：家 → 最寄りの出入口 → 高速 → 現場
//   ③ 電車の人は家の最寄り駅から（運賃は距離からの推定）
//   道のり ＝ 直線 × 係数（初期 1.3）、ガソリン単価 ＝ 時価 ＋ 上乗せ（初期 2 円）。高速は会社や家から現場が遠いときだけ（初期 25km 超）
const TRANSPORT_DEFAULT = {
  company: { place:"会社（川畑さん宅）埼玉県八潮市伊勢野136-9", lat:35.80975, lng:139.85529 },
  homes: {
    "裕太": { place:"会社", lat:35.80975, lng:139.85529 },
    "川畑": { place:"会社", lat:35.80975, lng:139.85529 },
    "大塚": { place:"藤の牛島駅（春日部）", lat:35.98026, lng:139.77803 },
    "小野": { place:"蒲生駅（越谷）", lat:35.86735, lng:139.79159 },
    "廣野": { place:"北越谷駅", lat:35.90237, lng:139.78007 },
  },
  pickup: ["小野"],      // 相乗りの日は家の近くで拾う人
  fuelMarket: 170,       // ガソリンの時価（円/L）。毎月直す
  fuelMarkup: 2,         // 時価に上乗せ
  kmPerL: 10,            // 車の燃費
  roadFactor: 1.3,       // 道のり ＝ 直線 × これ
  highwayKm: 25,         // 出発地から現場まで（直線）これより遠ければ高速を使う
  tollBase: 165,         // 高速料金（片道）＝ これ ＋ 高速の道のり × tollPerKm（NEXCO 普通車の目安）
  tollPerKm: 27,
  trainBase: 150,        // 電車の運賃（片道）＝ これ ＋ 道のり × trainPerKm（目安）
  trainPerKm: 20,
};
const geoKm = (a, b) => {
  if (!a || !b || a.lat == null || b.lat == null) return null;
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
function nearestIC(pt) {
  if (typeof IC_KANTO === "undefined" || !pt) return null;
  let best = null, bd = Infinity;
  for (const [n, lat, lng] of IC_KANTO) { const d = geoKm(pt, { lat, lng }); if (d < bd) { bd = d; best = { name:n, lat, lng, km:d }; } }
  return best;
}
// 出発地（と途中で拾う場所）から現場までの片道。高速を使う時は 出発 → 最寄りの出入口 → 現場に近い出入口 → 現場
function transportLeg(t, points, site) {
  const f = Number(t.roadFactor) || 1.3;
  let straight = 0;
  for (let i = 0; i < points.length; i++) straight += geoKm(points[i], i + 1 < points.length ? points[i + 1] : site) || 0;
  const start = points[0];
  const useHighway = (geoKm(start, site) || 0) > Number(t.highwayKm || 25);
  if (!useHighway) return { km: straight * f, hwKm: 0, toll: 0, icIn: null, icOut: null };
  const last = points[points.length - 1];
  const icIn = nearestIC(last), icOut = nearestIC(site);
  if (!icIn || !icOut || icIn.name === icOut.name) return { km: straight * f, hwKm: 0, toll: 0, icIn: null, icOut: null };
  const before = straight - (geoKm(last, site) || 0);
  const hw = (geoKm(icIn, icOut) || 0) * f;
  const km = (before + icIn.km + (geoKm(icIn, icOut) || 0) + icOut.km) * f;
  return { km, hwKm: hw, toll: Number(t.tollBase || 0) + hw * Number(t.tollPerKm || 0), icIn: icIn.name, icOut: icOut.name };
}
// 現場 1 日分の交通費の推定。logs はその日・その現場の打刻（1 人 1 件）
function estimateTransport(t, site, logs) {
  if (!site || site.lat == null) return { total: 0, fuel: 0, toll: 0, train: 0, lines: ["現場の位置が未登録（初回の退勤で登録されます）"], ok: false };
  const fuelPrice = Number(t.fuelMarket || 0) + Number(t.fuelMarkup || 0);
  const fuelOf = km => km / (Number(t.kmPerL) || 10) * fuelPrice;
  const home = n => t.homes?.[n] || t.company;
  const out = { total: 0, fuel: 0, toll: 0, train: 0, lines: [], ok: true };
  // 社用車：出勤時に「社用車」を選んだ人（運転）＝ 1 台。「相乗り」（未選択も）の人は、出勤ボタンを押した時刻がいちばん近い運転の人の車に乗る。
  //   運転の人がいない日は 1 台とみなす（2 台で行った日も、運転を選んだ人が 2 人いれば 2 台になる）
  const pressed = l => new Date(l.createdAt || l.clockIn).getTime();
  const drivers = logs.filter(l => l.commuteMethod === "company_car");
  const riders = logs.filter(l => !l.commuteMethod || l.commuteMethod === "company_car_shared");
  const cars = drivers.length ? drivers.map(d => ({ driver: d.userName, members: [d.userName], t: pressed(d) })) : (riders.length ? [{ driver: null, members: [], t: 0 }] : []);
  for (const r of riders) {
    let best = cars[0];
    for (const c of cars) if (Math.abs(pressed(r) - c.t) < Math.abs(pressed(r) - best.t)) best = c;
    best.members.push(r.userName);
  }
  const own = logs.filter(l => l.commuteMethod === "own_car").map(l => l.userName);
  const train = logs.filter(l => l.commuteMethod === "train").map(l => l.userName);
  cars.forEach((c, ci) => {
    const car = c.members;
    // 拾う人（同乗する人だけ）：寄り道が、その人が会社まで来る片道より短い時だけ拾う。遠回りなら会社に来てもらう
    const picks = car.filter(n => n !== c.driver && (t.pickup || []).includes(n) && (() => {
      const h = home(n);
      const detour = (geoKm(t.company, h) || 0) + (geoKm(h, site) || 0) - (geoKm(t.company, site) || 0);
      return detour < (geoKm(h, t.company) || 0);   // 車は行き帰りとも寄り道、その人も行き帰り会社まで → 片道どうしで比べる
    })());
    const leg = transportLeg(t, [t.company, ...picks.map(home)], site);
    const fuel = fuelOf(leg.km * 2), toll = leg.toll * 2;
    out.fuel += fuel; out.toll += toll;
    const label = cars.length > 1 ? `社用車${ci + 1}台目` : "社用車";
    out.lines.push(`${label}（${c.driver ? c.driver + "運転" : "運転者未選択"}${car.filter(n => n !== c.driver).length ? "・" + car.filter(n => n !== c.driver).join("・") + "同乗" : ""}）：会社${picks.length ? "→" + picks.join("・") + "宅" : ""}→現場 片道約${leg.km.toFixed(0)}km` +
      (leg.icIn ? `、高速 ${leg.icIn}→${leg.icOut} 約${leg.hwKm.toFixed(0)}km` : "") + `　ガソリン${Math.round(fuel).toLocaleString()}円${toll ? "・高速" + Math.round(toll).toLocaleString() + "円" : ""}`);
    // 集合（会社＝川畑さん宅）まで：家が遠い人の車 1 台で、途中の人を拾って来る（例：大塚が廣野・小野を拾う。大塚がいなければ廣野が小野を拾う）
    const feeders = car.filter(n => !picks.includes(n) && (geoKm(home(n), t.company) || 0) * (Number(t.roadFactor) || 1.3) >= 0.5)
      .sort((a, b) => (geoKm(home(b), t.company) || 0) - (geoKm(home(a), t.company) || 0));
    if (feeders.length) {
      const pts = feeders.map(home);
      let straight = 0;
      for (let i = 0; i < pts.length; i++) straight += geoKm(pts[i], i + 1 < pts.length ? pts[i + 1] : t.company) || 0;
      const km = straight * (Number(t.roadFactor) || 1.3);
      const f = fuelOf(km * 2); out.fuel += f;
      out.lines.push(`集合まで（${feeders[0]}の車${feeders.length > 1 ? "で" + feeders.slice(1).join("・") + "を拾う" : ""}）：${feeders.join("宅→")}宅→会社 片道約${km.toFixed(0)}km　ガソリン${Math.round(f).toLocaleString()}円`);
    }
  });
  for (const n of own) {
    const leg = transportLeg(t, [home(n)], site);
    const fuel = fuelOf(leg.km * 2), toll = leg.toll * 2;
    out.fuel += fuel; out.toll += toll;
    out.lines.push(`${n}（自家用・直行直帰）：片道約${leg.km.toFixed(0)}km` + (leg.icIn ? `、高速 ${leg.icIn}→${leg.icOut}` : "") + `　ガソリン${Math.round(fuel).toLocaleString()}円${toll ? "・高速" + Math.round(toll).toLocaleString() + "円" : ""}`);
  }
  for (const n of train) {
    const km = (geoKm(home(n), site) || 0) * (Number(t.roadFactor) || 1.3);
    const fare = (Number(t.trainBase || 0) + km * Number(t.trainPerKm || 0)) * 2;
    out.train += fare;
    out.lines.push(`${n}（電車）：${home(n).place || "家"}から約${km.toFixed(0)}km　運賃${Math.round(fare).toLocaleString()}円（往復の目安）`);
  }
  out.total = out.fuel + out.toll + out.train;
  return out;
}

const genkaYen = n => (n == null || isNaN(n)) ? "—" : Math.round(n).toLocaleString();
const genkaPct = n => (n == null || !isFinite(n)) ? "—" : (n * 100).toFixed(0) + "%";
// 年間出勤日数：直近 365 日の出勤日（同じ日は 1 日）。打刻の期間が 1 年に満たなければ 1 年分に換算
function genkaWorkdays(clockLogs, name) {
  const since = Date.now() - 365 * 86400000;
  const dates = new Set(clockLogs.filter(l => l.userName === name && new Date(l.clockIn).getTime() >= since).map(l => dateStrJST(l.clockIn)));
  if (dates.size === 0) return 0;
  const first = [...dates].sort()[0];
  const spanDays = Math.max(30, (Date.now() - new Date(first + "T00:00:00").getTime()) / 86400000);
  return Math.round(spanDays >= 365 ? dates.size : dates.size * 365 / spanDays);
}
function genkaUnits(cfg, clockLogs) {
  const out = {};
  for (const p of cfg.people) {
    const counted = genkaWorkdays(clockLogs, p.name);
    const auto = counted >= 120 ? counted : Number(cfg.standardDays || 240);   // 打刻が年 120 日未満なら標準の日数
    const days = Number(cfg.workdays?.[p.name]) || auto;
    out[p.name] = { annual: Number(p.annual) || 0, autoDays: auto, counted, days, unit: days > 0 ? (Number(p.annual) || 0) * (1 + Number(cfg.insuranceRate || 0)) / days : 0 };
  }
  return out;
}
// 現場 1 つ分を日ごと・月ごとに集計
function calcGenka(project, cfg, ctx) {
  const units = genkaUnits(cfg, ctx.clockLogs);
  const pid = project.id;
  const logs = ctx.clockLogs.filter(l => l.projectId === pid);
  const dayOver = cfg.days?.[pid] || {};
  const byDay = {};
  const day = d => (byDay[d] = byDay[d] || { date:d, mandays:{}, otHours:0, labor:0, overtime:0, outsource:0, material:0, transport:0, allowance:0, note:"" });
  for (const l of logs) {
    const d = day(dateStrJST(l.clockIn));
    const ot = (l.clockOut && !l.isNightShift) ? calcOvertime(l.clockIn, l.clockOut) : 0;
    d.mandays[l.userName] = (d.mandays[l.userName] || 0) + 1;
    d.otHours += ot;
    const u = units[l.userName]?.unit || 0;
    d.overtime += ot * (u / 8) * Number(cfg.overtimeRate || 1.25);
    if (l.outsourceType === "support") d.outsource += Number(l.outsourceAmount) || 0;
    if (l.outsourceType === "subcontract") d.outsource += Number(l.outsourceAmount) || 0;
  }
  for (const e of ctx.expenseItems.filter(e => e.projectId === pid && e.date)) {
    const d = day(e.date);
    if (e.category === "material") d.material += Number(e.amount) || 0;
    else if (e.category === "subcontract") d.outsource += Number(e.amount) || 0;
    else d.allowance += Number(e.amount) || 0;
  }
  for (const m of ctx.materialCosts.filter(m => m.projectId === pid && m.itemDate)) day(m.itemDate).material += Number(m.amount) || 0;
  for (const [date, o] of Object.entries(dayOver)) {
    const d = day(date);
    if (o.mandays) for (const [n, v] of Object.entries(o.mandays)) d.mandays[n] = Number(v) || 0;
    if (o.outsource !== undefined && o.outsource !== "") d.outsourceOverride = Number(o.outsource) || 0;
    if (o.material !== undefined && o.material !== "") d.materialOverride = Number(o.material) || 0;
    if (o.transport !== undefined && o.transport !== "") d.transportOverride = Number(o.transport) || 0;
    d.allowance += Number(o.allowance) || 0;
    d.note = o.note || "";
  }
  for (const d of Object.values(byDay)) {
    d.outsourceCalc = d.outsource; d.materialCalc = d.material;
    // 交通費：その日の打刻（1 人 1 件）から推定。手で入れた日はその金額
    const dayLogs = []; const seenU = new Set();
    for (const l of logs) if (dateStrJST(l.clockIn) === d.date && !seenU.has(l.userName)) { seenU.add(l.userName); dayLogs.push(l); }
    const est = estimateTransport({ ...TRANSPORT_DEFAULT, ...(cfg.transport || {}) }, project.siteLat != null ? { lat: project.siteLat, lng: project.siteLng } : null, dayLogs);
    d.transportAuto = est.total; d.transportLines = est.lines; d.transportOk = est.ok;
    d.transport = d.transportOverride !== undefined ? d.transportOverride : est.total;
    if (d.outsourceOverride !== undefined) d.outsource = d.outsourceOverride;
    if (d.materialOverride !== undefined) d.material = d.materialOverride;
    d.labor = Object.entries(d.mandays).reduce((s, [n, v]) => s + v * (units[n]?.unit || 0), 0);
    d.total = d.labor + d.overtime + d.outsource + d.material + d.transport + d.allowance;
    d.manTotal = Object.values(d.mandays).reduce((s, v) => s + v, 0);
  }
  const months = {};
  for (const d of Object.values(byDay).sort((a, b) => a.date < b.date ? -1 : 1)) {
    const ym = d.date.slice(0, 7);
    const m = (months[ym] = months[ym] || { ym, days:[], labor:0, overtime:0, outsource:0, material:0, transport:0, allowance:0, total:0, man:0 });
    m.days.push(d);
    for (const k of ["labor","overtime","outsource","material","transport","allowance","total"]) m[k] += d[k];
    m.man += d.manTotal;
  }
  const contract = Number(project.contractAmount) || 0;
  const additional = ctx.additionalEstimates.filter(e => e.projectId === pid).reduce((s, e) => s + (Number(e.contractAmount) || 0), 0);
  const revenue = contract + additional;
  const overhead = contract * Number(cfg.overheadRate || 0);
  const sum = k => Object.values(months).reduce((s, m) => s + m[k], 0);
  const direct = { labor: sum("labor"), overtime: sum("overtime"), outsource: sum("outsource"), material: sum("material"), transport: sum("transport"), allowance: sum("allowance") };
  const totalCost = direct.labor + direct.overtime + direct.outsource + direct.material + direct.transport + direct.allowance + overhead;
  const usedMan = sum("man");
  const budget = revenue - overhead;
  const budgetMan = Number(cfg.budgetUnit) > 0 ? budget / Number(cfg.budgetUnit) : 0;
  const progress = getLatestProgress(project, ctx.progressReports);
  let balance = revenue;
  const monthList = Object.values(months).sort((a, b) => a.ym < b.ym ? -1 : 1).map((m, i) => {
    const prev = balance;
    balance -= m.total + (i === 0 ? overhead : 0);
    return { ...m, overheadThisMonth: i === 0 ? overhead : 0, prevBalance: prev, balance };
  });
  return {
    units, contract, additional, revenue, overhead, direct, totalCost, usedMan, budget, budgetMan,
    remainMan: budgetMan - usedMan, gross: revenue - totalCost, progress, months: monthList,
    rates: {
      labor: totalCost > 0 ? (direct.labor + direct.overtime) / totalCost : null,
      profit: revenue > 0 ? (revenue - totalCost) / revenue : null,
      material: revenue > 0 ? direct.material / revenue : null,
      outsource: totalCost > 0 ? direct.outsource / totalCost : null,
      budgetMan: budgetMan > 0 ? usedMan / budgetMan : null,
    },
    perManDay: usedMan > 0 ? (revenue - direct.material - direct.outsource) / usedMan : null,
  };
}

        {(()=>{ const t={...TRANSPORT_DEFAULT,...(cfg.transport||{})}; const setT=patch=>setCfg({...cfg,transport:{...t,...patch}});

            </div></div>); })()}
      </div>}

            kv("交通費・諸手当", genkaYen(g.direct.transport + g.direct.allowance)),
            kv(`諸経費（${genkaPct(cfg.overheadRate)}）`, genkaYen(g.overhead)),

            kv("使った人工 ／ 残り", `${g.usedMan.toFixed(1)} ／ ${g.remainMan.toFixed(1)}`, `予算の ${genkaPct(g.rates.budgetMan)} を使用`, g.remainMan < 0 ? "#dc2626" : null),
            kv("出来高（最新の進捗）", g.progress != null ? g.progress + "%" : "未入力", g.rates.budgetMan != null && g.progress != null ? (g.rates.budgetMan * 100 > g.progress ? "⚠ 進捗より人工の使い方が速い" : "✓ 進捗の範囲内") : null),

      </div>
      {g.months.slice().reverse().map(m => { const open = openYm ? openYm === m.ym : m === g.months[g.months.length-1]; return (

            <b style={{fontSize:13}}>{open?"▼":"▶"} {Number(m.ym.slice(5))}月分（{m.ym.slice(0,4)}年）</b>
            <span>人工 {m.man}</span><span>当月原価 {genkaYen(m.total + m.overheadThisMonth)}</span>

          </div>
          {open && <div style={{overflow:"auto",marginTop:8}}>
            <table style={{borderCollapse:"collapse",minWidth:"100%"}}>
              <thead><tr><th style={th}>日</th>{people.map(n=><th key={n} style={th}>{n}<br/><span style={{fontWeight:400}}>{genkaYen(g.units[n]?.unit)}</span></th>)}<th style={th}>残業h</th><th style={th}>人件費</th><th style={th}>外注</th><th style={th}>材料</th><th style={th}>交通費</th><th style={th}>諸手当</th><th style={th}>日計</th><th style={th}>メモ</th></tr></thead>

                  <td style={td}><input style={inp} placeholder={d.materialCalc ? genkaYen(d.materialCalc) : ""} value={cfg.days?.[project.id]?.[d.date]?.material ?? ""} onChange={e=>setDay(d.date,{material:e.target.value.replace(/[^0-9]/g,"")})}/></td>
                  <td style={td}><input style={inp} placeholder={d.transportAuto ? genkaYen(d.transportAuto) : (d.transportOk === false ? "位置なし" : "")} value={cfg.days?.[project.id]?.[d.date]?.transport ?? ""} onChange={e=>setDay(d.date,{transport:e.target.value.replace(/[^0-9]/g,"")})}/>
                    <button title={(d.transportLines||[]).join("\n")} onClick={()=>setOpenDay(openDay===d.date?"":d.date)} style={{marginLeft:2,fontSize:10,padding:"0 4px",border:"1px solid #d1d5db",borderRadius:4,background:openDay===d.date?"#dbeafe":"#fff",cursor:"pointer"}}>内訳</button></td>

                </tr>,

                  <div style={{color:"#6b7280"}}>推定 {genkaYen(d.transportAuto)} 円。実費と違えば交通費の欄に金額を入れると、そちらを使います（相乗り・自家用・電車は出勤時の通勤方法から）</div></td></tr>
                ])}

                  {people.map(n => <td key={n} style={td}>{m.days.reduce((s,d)=>s+(d.mandays[n]||0),0)||""}</td>)}
                  <td style={td}></td><td style={td}>{genkaYen(m.labor+m.overtime)}</td><td style={td}>{genkaYen(m.outsource)}</td><td style={td}>{genkaYen(m.material)}</td>
                  <td style={td}>{genkaYen(m.transport)}</td><td style={td}>{genkaYen(m.allowance)}</td><td style={td}>{genkaYen(m.total)}</td><td style={td}></td>
                </tr>
              </tbody>
            </table>
            <div style={{fontSize:10,color:"#6b7280",marginTop:4}}>人工は打刻から（1打刻＝1人工）。外注・材料の薄い数字はアプリの記録（外注＝打刻の応援・請負と経費の外注、材料＝請求書と経費の材料）。実際の金額が違えば上書きして「入力を保存」。{m.overheadThisMonth>0?`最初の月に諸経費 ${genkaYen(m.overheadThisMonth)} を計上（Excel と同じ）。`:""}</div>
          </div>}
        </div>); })}
    </div>
  );
}

function FinanceTab({ projects, progressReports, costCtx, showToast }) {
  const [fin, setFin] = useState(null);
  const [view, setView] = useState("まとめ");
  const [draft, setDraft] = useState(null);
  const [saving, setSaving] = useState(false);
  useEffect(() => { sb("finance_data?select=*&key=eq.main").then(rows => {
    const v = { ...FIN_DEFAULT, ...((rows && rows[0]?.value) || {}) }; setFin(v); setDraft(JSON.parse(JSON.stringify(v)));
  }); }, []);
  const R = useMemo(() => fin ? finCalc(fin, projects, progressReports, costCtx) : null, [fin, projects, progressReports, costCtx]);
  if (!R) return <div style={{ padding:40, color:FC.sub, background:FC.bg, minHeight:"60vh" }}>読み込み中...</div>;

  const save = async (next) => {
    setSaving(true);
    const res = await apiGateway("save_finance", { value: next });
    setSaving(false);
    if (!res || !res.ok) { showToast("⚠ 保存に失敗: " + ((res && res.error) || getLastApiError() || "")); return false; }
    setFin(next); setDraft(JSON.parse(JSON.stringify(next))); showToast("✓ 保存しました"); return true;
  };
  const sig = c => <span style={{ display:"inline-block", width:8, height:8, borderRadius:4, background:FC[c], marginRight:6 }}/>;
  const months = R.snap ? R.snap.available / Math.max(1, R.monthlyOut) : null;

      <div style={{ fontSize:11, color:FC.sub }}>{sig(c)}{label}</div>
      <div style={{ fontSize:26, fontWeight:900, color:FC.tx, marginTop:4, fontVariantNumeric:"tabular-nums" }}>{val}<span style={{ fontSize:13, color:FC.sub, marginLeft:3 }}>{unit}</span></div>
      {sub && <div style={{ fontSize:11, color:FC.sub, marginTop:2 }}>{sub}</div>}
    </div>);
  const balColor = v => v < R.monthlyOut * 3 ? (v < R.monthlyOut ? "r" : "y") : "g";

  return (<div style={{ background:FC.bg, color:FC.tx, minHeight:"80vh", padding:"16px 14px 40px", fontFamily:"'Noto Sans JP',sans-serif" }}>

      <div style={{ display:"flex", alignItems:"baseline", gap:10, marginBottom:4 }}>

        <div style={{ fontSize:11, color:FC.sub }}>出来高ベース・税抜／単位：万円</div>
      </div>
      {!R.snap && <div style={{ ...finCard, borderColor:FC.gold, color:FC.gold, fontSize:13 }}>まだ通帳残高が入っていません。「入力」から残高を入れると、残高の予測が出ます。</div>}
      <div style={{ display:"flex", gap:6, margin:"10px 0 14px", overflowX:"auto" }}>
        {["まとめ","お金の流れ","現場と売上","入力"].map(v => <button key={v} onClick={() => setView(v)} style={{ flex:"none", padding:"9px 16px", borderRadius:20, border:`1px solid ${view===v ? FC.gold : FC.line}`, background:view===v ? FC.gold : "transparent", color:view===v ? "#111" : FC.sub, fontWeight:800, fontSize:13, cursor:"pointer" }}>{v}</button>)}
      </div>

      {view === "まとめ" && (<>
        <div style={{ ...finCard, background:"linear-gradient(135deg,#1a2442,#0e1528)", borderColor:"#3b4a6e" }}>
          <div style={{ fontSize:12, color:FC.sub }}>いまの現預金（すぐ使える分）{R.snap && `・${R.snap.date}時点`}</div>
          <div style={{ fontSize:42, fontWeight:900, color:FC.gold, fontVariantNumeric:"tabular-nums", lineHeight:1.2 }}>{R.snap ? finMan(R.snap.available) : "—"}<span style={{ fontSize:16, marginLeft:4 }}>万円</span></div>
          <div style={{ fontSize:13, color:FC.sub }}>固定費＋返済（月{finMan(R.monthlyOut)}万）の <b style={{ color:months!==null && months>=3 ? FC.g : FC.y, fontSize:16 }}>{months !== null ? months.toFixed(1) : "—"}か月分</b>（目標3か月→6か月）</div>
        </div>

          {kpi("今月の出来高見込み", finMan(R.pl[6].dk), "万", R.pl[6].dk >= R.breakevenRepay ? "g" : R.pl[6].dk >= R.breakeven ? "y" : "r", `分岐 ${finMan(R.breakeven)}万／返済込み ${finMan(R.breakevenRepay)}万`)}

        <div style={finCard}><div style={finH}>月ごとの出入り（万円）</div><div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}><thead><tr>{["月","入金","固定費","材料・外注","返済","増減","月末残高"].map(h => <th key={h} style={{ ...finTd, color:FC.sub, textAlign:h==="月"?"left":"right" }}>{h}</th>)}</tr></thead>
          <tbody>{R.cf.map(r => <tr key={r.k}><td style={{ ...finTd, textAlign:"left" }}>{finLabel(r.k)}</td><td style={finTd}>{finMan(r.inc)}</td><td style={finTd}>{finMan(r.fixed)}</td><td style={finTd}>{finMan(r.vc)}</td><td style={finTd}>{finMan(r.rep)}</td>
            <td style={{ ...finTd, color:r.diff<0?FC.r:FC.g, fontWeight:800 }}>{r.diff>0?"+":""}{finMan(r.diff)}</td><td style={{ ...finTd, fontWeight:900, color:FC.gold }}>{finMan(r.bal)}</td></tr>)}</tbody></table></div></div>
        <div style={finCard}><div style={finH}>借入と完済の時期</div>
          {R.f.loans.length === 0 ? <div style={{ fontSize:13, color:FC.sub }}>「入力」で返済予定表から借入を登録すると出ます</div> : (<>
            {R.f.loans.map((l, i) => <div key={i} style={{ display:"flex", justifyContent:"space-between", fontSize:13, padding:"6px 0", borderBottom:`1px solid ${FC.line}` }}><span>{l.name || "借入"}</span><span>月{finMan(l.monthly)}万・完済 <b style={{ color:FC.gold }}>{l.endMonth || "—"}</b></span></div>)}
            <FinBars rows={Array.from({ length:12 }, (_, i) => { const k = finAdd(R.nowKey, i); return { v:finLoanPay(R.f.loans, k), label:finLabel(k), hl:R.easier && k===R.easier.k }; })} max={Math.max(1, R.repNow) * 1.2} color={r => r.hl ? FC.g : FC.y}/>
            {R.easier && <div style={{ fontSize:13, marginTop:10 }}>🎉 <b style={{ color:FC.g }}>{R.easier.k.replace("-","年")}月</b>から返済が月{finMan(R.easier.before)}万→<b>{finMan(R.easier.after)}万</b></div>}
          </>)}
        </div>
      </>)}

      {view === "現場と売上" && (<>
        <div style={finCard}><div style={finH}>月ごとの赤黒（出来高ベース）と損益分岐ライン</div>
          <FinBars rows={R.pl.map(r => ({ v:r.dk, label:finLabel(r.k), hl:r.now, dim:!r.past && !r.now }))} max={Math.max(...R.pl.map(r => r.dk), R.breakevenRepay) * 1.15}
            color={r => r.v >= R.breakevenRepay ? FC.g : r.v >= R.breakeven ? FC.y : FC.r}
            lines={[[R.breakeven, FC.r, `分岐 ${finMan(R.breakeven)}`], [R.breakevenRepay, FC.v, `返済込み ${finMan(R.breakevenRepay)}`]]}/>
          <div style={{ fontSize:11, color:FC.sub, marginTop:8 }}>左6本＝実績（請負×進捗%を月ごとの人工の割合で配分）／薄い棒＝見込み。紫の線を超えると現金が減らない。請負額が未入力の現場は入りません</div>
          <div style={{ overflowX:"auto", marginTop:10 }}><table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}><thead><tr>{["月","出来高","限界利益","損益","返済後"].map(h => <th key={h} style={{ ...finTd, color:FC.sub, textAlign:h==="月"?"left":"right" }}>{h}</th>)}</tr></thead>
          <tbody>{R.pl.map(r => <tr key={r.k} style={{ opacity:r.past||r.now?1:.7 }}><td style={{ ...finTd, textAlign:"left", color:r.now?FC.gold:FC.tx }}>{finLabel(r.k)}{r.now?"（今月）":""}</td><td style={finTd}>{finMan(r.dk)}</td><td style={finTd}>{finMan(r.mp)}</td>
            <td style={{ ...finTd, color:r.profit<0?FC.r:FC.g, fontWeight:800 }}>{finMan(r.profit)}</td><td style={{ ...finTd, color:r.afterRepay<0?FC.r:FC.g, fontWeight:800 }}>{finMan(r.afterRepay)}</td></tr>)}</tbody></table></div>
        </div>
        <div style={finCard}><div style={finH}>現場ごとの売上見込み（請負×進捗）</div><div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}><thead><tr>{["現場","請負","進捗","今月の出来高","受注残","判定"].map(h => <th key={h} style={{ ...finTd, color:FC.sub, textAlign:h==="現場"?"left":"right" }}>{h}</th>)}</tr></thead>
          <tbody>{R.pj.map(x => <tr key={x.p.id}><td style={{ ...finTd, textAlign:"left", maxWidth:170, overflow:"hidden", textOverflow:"ellipsis" }}>{x.p.name}<div style={{ fontSize:10, color:FC.sub }}>{x.p.lead}・入金{x.lag}か月後</div></td>
            <td style={finTd}>{x.amt > 0 ? finMan(x.amt) : <span style={{ color:FC.y }}>未入力</span>}</td>
            <td style={finTd}>{x.prog}%{x.est && <span style={{ fontSize:9, color:FC.y }}> 推定</span>}<div style={{ height:5, background:FC.line, borderRadius:3, marginTop:3 }}><div style={{ width:`${x.prog}%`, height:"100%", background:FC.gold, borderRadius:3 }}/></div></td>
            <td style={finTd}>{finMan(x.nowDk)}</td><td style={finTd}>{finMan(x.remain)}</td><td style={{ ...finTd, color:x.cost.status.color, fontWeight:700 }}>{x.cost.status.level==="unknown"?"—":x.cost.status.label}</td></tr>)}</tbody></table></div></div>
      </>)}

      {view === "入力" && draft && <FinanceInput draft={draft} setDraft={setDraft} fin={fin} save={save} saving={saving} leads={[...new Set(R.pj.map(x => x.p.lead).filter(Boolean))]}/>}
    </div>
  </div>);
}

// お金タブの入力（毎月1日の残高＋最初に1回の設定）。金額は万円で入れて円で保存
function FinanceInput({ draft, setDraft, fin, save, saving, leads }) {
  const todayStr = new Date(Date.now() + 9*3600000).toISOString().slice(0,10);
  const [cash, setCash] = useState({ date: todayStr, available: "", locked: "" });
  const man = v => (v === "" || v == null) ? "" : Math.round(Number(v) / 10000 * 10) / 10;
  const yen = v => Math.round((Number(v) || 0) * 10000);
  const upd = patch => setDraft({ ...draft, ...patch });
  const updLoan = (i, patch) => upd({ loans: draft.loans.map((l, j) => j === i ? { ...l, ...patch } : l) });
  const lbl = { display:"block", fontSize:12, color:FC.sub, margin:"10px 0 4px" };
  const btn = { background:FC.gold, color:"#111", border:0, borderRadius:10, padding:12, width:"100%", fontWeight:900, fontSize:14, marginTop:14, cursor:"pointer", opacity:saving ? .6 : 1 };
  const addCash = async () => {
    if (cash.available === "") return;
    const list = (fin.cash || []).filter(c => c.date !== cash.date);
    const ok = await save({ ...fin, cash: [...list, { date: cash.date, available: yen(cash.available), locked: yen(cash.locked) }].sort((a,b) => a.date < b.date ? -1 : 1) });
    if (ok) setCash({ ...cash, available: "", locked: "" });
  };
  const history = [...(fin.cash || [])].reverse().slice(0, 6);
  return (<>
    <div style={finCard}><div style={finH}>毎月1日：通帳残高（1分）</div>
      <label style={lbl}>基準日</label><input type="date" value={cash.date} onChange={e => setCash({ ...cash, date: e.target.value })} style={finInput}/>
      <label style={lbl}>普通預金・現金の合計（全口座・万円）</label><input inputMode="decimal" value={cash.available} onChange={e => setCash({ ...cash, available: e.target.value })} placeholder="例：1750" style={finInput}/>
      <label style={lbl}>定期・積立など、すぐ使えない分（万円・任意）</label><input inputMode="decimal" value={cash.locked} onChange={e => setCash({ ...cash, locked: e.target.value })} placeholder="例：560" style={finInput}/>
      <button onClick={addCash} disabled={saving} style={btn}>保存して予測を更新</button>
      {history.length > 0 && <div style={{ marginTop:12, fontSize:12, color:FC.sub }}>{history.map(c => <div key={c.date} style={{ display:"flex", justifyContent:"space-between", padding:"4px 0", borderBottom:`1px solid ${FC.line}` }}><span>{c.date}</span><span style={{ color:FC.tx }}>{finMan(c.available)}万{c.locked ? `（ほか定期等 ${finMan(c.locked)}万）` : ""}</span></div>)}</div>}
    </div>

    <div style={finCard}><div style={finH}>設定（最初に1回・変わったときだけ）</div>
      <label style={lbl}>固定費／月（人件費・販管費・利息。返済は含めない・万円）</label>
      <input inputMode="decimal" defaultValue={man(draft.fixedCost)} onChange={e => upd({ fixedCost: yen(e.target.value) })} style={finInput}/>
      <label style={lbl}>変動費率（材料・外注 ÷ 出来高・%）</label>
      <input inputMode="decimal" defaultValue={Math.round((Number(draft.variableRate) || 0) * 1000) / 10} onChange={e => upd({ variableRate: (Number(e.target.value) || 0) / 100 })} style={finInput}/>
      <label style={lbl}>入金タイミングの既定（出来高の何か月後に入金か）</label>
      <input inputMode="numeric" value={draft.defaultLag} onChange={e => upd({ defaultLag: Number(e.target.value) || 0 })} style={finInput}/>
      <div style={{ fontSize:11, color:FC.sub, marginTop:4 }}>※ 初期値は2025年10月期の決算書から（固定費 月463万・変動費率37%）。9月までの試算表で直すと精度が上がります</div>

      <div style={{ ...finH, marginTop:18 }}>客先ごとの入金タイミング（空欄＝既定）</div>
      {leads.map(ld => <div key={ld} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
        <span style={{ flex:1, fontSize:13 }}>{ld}</span>
        <input inputMode="numeric" value={draft.clientLags?.[ld] ?? ""} placeholder={String(draft.defaultLag)} onChange={e => { const cl = { ...(draft.clientLags || {}) }; if (e.target.value === "") delete cl[ld]; else cl[ld] = Number(e.target.value) || 0; upd({ clientLags: cl }); }} style={{ ...finInput, width:70 }}/>
        <span style={{ fontSize:12, color:FC.sub }}>か月後</span></div>)}

      <div style={{ ...finH, marginTop:18 }}>借入・リース（返済予定表から）</div>
      {draft.loans.map((l, i) => <div key={l.id || i} style={{ border:`1px solid ${FC.line}`, borderRadius:10, padding:10, marginBottom:8 }}>
        <input value={l.name || ""} onChange={e => updLoan(i, { name: e.target.value })} placeholder="名前（例：埼玉りそな 運転資金）" style={finInput}/>
        <div style={{ display:"flex", gap:6, marginTop:6 }}>
          <input inputMode="decimal" defaultValue={man(l.monthly)} onChange={e => updLoan(i, { monthly: yen(e.target.value) })} placeholder="月の返済（万）" style={finInput}/>
          <input type="month" value={l.endMonth || ""} onChange={e => updLoan(i, { endMonth: e.target.value })} style={finInput} title="最後の返済月"/>
        </div>
        <button onClick={() => upd({ loans: draft.loans.filter((_, j) => j !== i) })} style={{ marginTop:6, background:"transparent", color:FC.r, border:`1px solid ${FC.r}55`, borderRadius:8, padding:"4px 10px", fontSize:12, cursor:"pointer" }}>この借入を外す</button>
      </div>)}
      <button onClick={() => upd({ loans: [...draft.loans, { id: uid(), name:"", monthly:0, endMonth:"" }] })} style={{ background:"transparent", color:FC.gold, border:`1px dashed ${FC.gold}`, borderRadius:10, padding:10, width:"100%", fontSize:13, cursor:"pointer" }}>＋ 借入を追加</button>
      <button onClick={() => save({ ...draft, cash: fin.cash || [] })} disabled={saving} style={btn}>設定を保存</button>
    </div>
  </>);
}

// [2026-04-27] 管理者メモタブ
function AdminNoteTab() {
  const [notes, setNotes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [content, setContent] = useState("");
  const [imageData, setImageData] = useState(null);
  const [imagePreview, setImagePreview] = useState(null);
  const [posting, setPosting] = useState(false);
  const [editId, setEditId] = useState(null);
  const [editContent, setEditContent] = useState("");
  const [editImage, setEditImage] = useState(null);
  const [lightboxSrc, setLightboxSrc] = useState(null);

  useEffect(()=>{
    loadAdminNotes().then(ns=>{ setNotes(ns); setLoading(false); });
  },[]);

  const handleImageChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { setImageData(ev.target.result); setImagePreview(ev.target.result); };
    reader.readAsDataURL(file);
  };

  const handlePost = async () => {
    if (!content.trim() && !imageData) return;
    setPosting(true);
    const id = uid();
    const ok = await insertAdminNote(id, content.trim(), imageData || null);
    if (ok) {
      setNotes(prev=>[{ id, content:content.trim(), image_url:imageData||null, created_at:new Date().toISOString(), updated_at:new Date().toISOString() }, ...prev]);
      setContent(""); setImageData(null); setImagePreview(null);
    }
    setPosting(false);
  };

  const startEdit = (note) => { setEditId(note.id); setEditContent(note.content); setEditImage(note.image_url||null); };

  const handleUpdate = async (note) => {
    const ok = await updateAdminNote(note.id, editContent, editImage);
    if (ok) {
      setNotes(prev=>prev.map(n=>n.id===note.id?{...n,content:editContent,image_url:editImage,updated_at:new Date().toISOString()}:n));
      setEditId(null);
    }
  };

  const handleDelete = async (id) => {
    if (!window.confirm("このメモを削除しますか？")) return;
    const ok = await deleteAdminNote(id);
    if (ok) setNotes(prev=>prev.filter(n=>n.id!==id));
  };

  const fmtDt = (iso) => {
    const d = new Date(iso);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  };

  return (
    <div style={{maxWidth:680,margin:"0 auto",padding:"0 16px 40px"}}>
      {/* 投稿フォーム */}
      <div style={{background:"#fafafa",border:"1px solid #d1d5db",borderRadius:12,padding:16,marginBottom:20}}>
        <textarea value={content} onChange={e=>setContent(e.target.value)} placeholder="メモを入力…" rows={3}
          style={{width:"100%",background:"#fafafa",border:"1px solid #d1d5db",borderRadius:8,padding:"10px 12px",color:"#111827",fontSize:14,outline:"none",resize:"vertical",boxSizing:"border-box",marginBottom:10}}/>
        {imagePreview&&(
          <div style={{position:"relative",marginBottom:10,display:"inline-block"}}>
            <img src={imagePreview} alt="preview" style={{maxHeight:120,borderRadius:8,border:"1px solid #9ca3af"}}/>
            <button onClick={()=>{setImageData(null);setImagePreview(null);}} style={{position:"absolute",top:-6,right:-6,background:"#ef4444",color:"#fff",border:"none",borderRadius:"50%",width:20,height:20,fontSize:12,cursor:"pointer",lineHeight:"20px",padding:0}}>✕</button>
          </div>
        )}
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <label style={{background:"#eff6ff",color:"#a78bfa",border:"1px solid #a78bfa44",borderRadius:6,padding:"6px 12px",fontSize:12,cursor:"pointer",flexShrink:0,whiteSpace:"nowrap"}}>
            📎 画像
            <input type="file" accept="image/*" onChange={handleImageChange} style={{display:"none"}}/>
          </label>
          <button onClick={handlePost} disabled={posting||(!content.trim()&&!imageData)}
            style={{background:posting||(!content.trim()&&!imageData)?"#e5e7eb":"linear-gradient(135deg,#a78bfa,#7c3aed)",color:posting||(!content.trim()&&!imageData)?"#9ca3af":"#fff",border:"none",borderRadius:6,padding:"6px 20px",fontSize:13,fontWeight:700,cursor:posting||(!content.trim()&&!imageData)?"not-allowed":"pointer",marginLeft:"auto"}}>
            {posting?"投稿中…":"投稿"}
          </button>
        </div>
      </div>

      {/* メモ一覧 */}
      {loading
        ?<div style={{color:"#111827",textAlign:"center",padding:20}}>読み込み中…</div>
        :notes.length===0
          ?<div style={{color:"#111827",textAlign:"center",padding:20}}>メモはまだありません</div>
          :notes.map(note=>(
            <div key={note.id} style={{background:"#fafafa",border:"1px solid #d1d5db",borderRadius:12,padding:16,marginBottom:12}}>
              {editId===note.id?(
                <div>
                  <textarea value={editContent} onChange={e=>setEditContent(e.target.value)} rows={3}
                    style={{width:"100%",background:"#fafafa",border:"1px solid #a78bfa44",borderRadius:8,padding:"10px 12px",color:"#111827",fontSize:14,outline:"none",resize:"vertical",boxSizing:"border-box",marginBottom:8}}/>
                  {editImage&&(
                    <div style={{position:"relative",marginBottom:8,display:"inline-block"}}>
                      <img src={editImage} alt="edit" style={{maxHeight:100,borderRadius:8,border:"1px solid #9ca3af"}}/>
                      <button onClick={()=>setEditImage(null)} style={{position:"absolute",top:-6,right:-6,background:"#ef4444",color:"#fff",border:"none",borderRadius:"50%",width:20,height:20,fontSize:12,cursor:"pointer",lineHeight:"20px",padding:0}}>✕</button>
                    </div>
                  )}
                  <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                    <button onClick={()=>setEditId(null)} style={{background:"transparent",color:"#6b7280",border:"1px solid #9ca3af",borderRadius:6,padding:"4px 12px",fontSize:12,cursor:"pointer"}}>キャンセル</button>
                    <button onClick={()=>handleUpdate(note)} style={{background:"linear-gradient(135deg,#a78bfa,#7c3aed)",color:"#fff",border:"none",borderRadius:6,padding:"4px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>保存</button>
                  </div>
                </div>
              ):(
                <>
                  {note.content&&<div style={{fontSize:14,color:"#111827",whiteSpace:"pre-wrap",marginBottom:note.image_url?10:0}}>{note.content}</div>}
                  {note.image_url&&<img src={note.image_url} alt="note" onClick={()=>setLightboxSrc(note.image_url)} style={{maxWidth:"100%",maxHeight:200,borderRadius:8,border:"1px solid #9ca3af",cursor:"zoom-in",display:"block"}}/>}
                  <div style={{display:"flex",alignItems:"center",marginTop:10,gap:8}}>
                    <div style={{fontSize:10,color:"#111827",flex:1}}>{fmtDt(note.created_at)}{note.updated_at!==note.created_at?" (編集済み)":""}</div>
                    <button onClick={()=>startEdit(note)} style={{background:"transparent",color:"#6b7280",border:"1px solid #9ca3af",borderRadius:6,padding:"2px 8px",fontSize:10,cursor:"pointer"}}>✏ 編集</button>
                    <button onClick={()=>handleDelete(note.id)} style={{background:"transparent",color:"#ef4444",border:"1px solid #ef444433",borderRadius:6,padding:"2px 8px",fontSize:10,cursor:"pointer"}}>🗑 削除</button>
                  </div>
                </>
              )}
            </div>
          ))
      }

      {/* ライトボックス */}
      {lightboxSrc&&(
        <div onClick={()=>setLightboxSrc(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",cursor:"zoom-out"}}>
          <img src={lightboxSrc} alt="拡大" style={{maxWidth:"90vw",maxHeight:"90vh",borderRadius:8,objectFit:"contain"}}/>
        </div>
      )}
    </div>
  );
}

// [2026-06-12] ご意見箱（匿名投稿の一覧・対応済み管理）
// staff_id は api-gateway 側で返さない＝投稿者は表示されない（匿名担保）
function SuggestionsTab() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState("all"); // all / pending

  useEffect(()=>{
    loadSuggestionsAdmin().then(rows=>{ setItems(rows||[]); setLoading(false); });
  },[]);

  const toggleStatus = async (it) => {
    const next = it.status==="対応済み" ? "未対応" : "対応済み";
    const ok = await updateSuggestionStatus(it.id, next);
    if (ok) setItems(prev=>prev.map(x=>x.id===it.id?{...x,status:next}:x));
  };

  const fmtDt = (iso) => {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  };

  const shown = filter==="pending" ? items.filter(x=>x.status!=="対応済み") : items;
  const pendingCount = items.filter(x=>x.status!=="対応済み").length;

  return (
    <div style={{maxWidth:680,margin:"0 auto",padding:"0 16px 40px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:700,color:"#111827"}}>📮 ご意見箱</div>
        <div style={{fontSize:11,color:"#6b7280"}}>匿名（投稿者は表示されません）／未対応 {pendingCount}件</div>
        <div style={{marginLeft:"auto",display:"flex",gap:6}}>
          {[["all","すべて"],["pending","未対応のみ"]].map(([k,lbl])=>(
            <button key={k} onClick={()=>setFilter(k)} style={{background:filter===k?"#f97316":"#fff",color:filter===k?"#fff":"#6b7280",border:"1px solid",borderColor:filter===k?"#f97316":"#d1d5db",borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>{lbl}</button>
          ))}
        </div>
      </div>
      {loading
        ?<div style={{color:"#111827",textAlign:"center",padding:20}}>読み込み中…</div>
        :shown.length===0
          ?<div style={{color:"#6b7280",textAlign:"center",padding:20}}>{filter==="pending"?"未対応のご意見はありません":"ご意見はまだありません"}</div>
          :shown.map(it=>(
            <div key={it.id} style={{background:"#fafafa",border:"1px solid #d1d5db",borderRadius:12,padding:16,marginBottom:12,opacity:it.status==="対応済み"?0.6:1}}>
              <div style={{fontSize:14,color:"#111827",whiteSpace:"pre-wrap",marginBottom:10}}>{it.content}</div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{fontSize:10,color:"#6b7280",flex:1}}>{fmtDt(it.createdAt)}</div>
                {it.status==="対応済み"&&<span style={{fontSize:10,color:"#16a34a",fontWeight:700}}>✓ 対応済み</span>}
                <button onClick={()=>toggleStatus(it)} style={{background:it.status==="対応済み"?"transparent":"#ecfdf5",color:it.status==="対応済み"?"#6b7280":"#16a34a",border:"1px solid",borderColor:it.status==="対応済み"?"#9ca3af":"#16a34a55",borderRadius:6,padding:"3px 10px",fontSize:10,fontWeight:700,cursor:"pointer"}}>{it.status==="対応済み"?"未対応に戻す":"対応済みにする"}</button>
              </div>
            </div>
          ))
      }
    </div>
  );
}

function BackupTab() {
  const [bkups, setBkups] = useState([]);
  const [bkLoading, setBkLoading] = useState(true);
  const [openYear, setOpenYear] = useState(null);
  const [openTable, setOpenTable] = useState(null);
  // [2026-05-21] base64→Storage 移行ボタン用 state
  const [migrating, setMigrating] = useState(false);
  const [migrateLog, setMigrateLog] = useState([]);
  useEffect(()=>{loadAnnualBackups().then(d=>{setBkups(d);setBkLoading(false);});},[]);
  const years=[...new Set(bkups.map(b=>b.fiscalYear))].sort((a,b)=>b-a);
  const runMigration = async () => {
    setMigrating(true);
    setMigrateLog(prev=>[...prev, "▶ 移行開始（10件ずつ処理）"]);
    let total = { atts: 0, cts: 0 };
    while (true) {
      const res = await migrateBase64ToStorage();
      if (!res || !res.ok) { setMigrateLog(prev=>[...prev, `❌ エラー: ${res?.error||"unknown"}`]); break; }
      const { result, remaining } = res;
      total.atts += result.attachments.migrated;
      total.cts += result.contacts.migrated;
      setMigrateLog(prev=>[...prev, `📦 attachments: ${result.attachments.migrated}件移行 / contacts: ${result.contacts.migrated}件移行 / 残り: 添付${remaining.attachments} 名刺${remaining.contacts}`]);
      if (remaining.attachments === 0 && remaining.contacts === 0) {
        setMigrateLog(prev=>[...prev, `✅ 完了！合計 添付${total.atts}件・名刺${total.cts}件をStorageへ移行しました`]);
        break;
      }
      if (result.attachments.processed === 0 && result.contacts.processed === 0) {
        setMigrateLog(prev=>[...prev, `⚠ 1件も処理されませんでした。中断します`]);
        break;
      }
    }
    setMigrating(false);
  };
  return (
    <div style={{padding:16}}>
      {/* [2026-05-21] base64→Storage 移行ボタン（残件0になるまで自動繰り返し） */}
      <div style={{background:"#fef3c7",border:"1px solid #f59e0b",borderRadius:8,padding:12,marginBottom:16}}>
        <div style={{fontSize:11,fontWeight:700,color:"#92400e",marginBottom:6}}>🔄 base64画像のStorage移行（ワンタイム）</div>
        <div style={{fontSize:10,color:"#92400e",marginBottom:8}}>既存の名刺写真・案件添付ファイル（base64でDB保存されているもの）をStorageへ移し替えます。残件ゼロになるまで自動で繰り返し実行されます。営業時間外の実行推奨。</div>
        <button onClick={runMigration} disabled={migrating} style={{background:migrating?"#e5e7eb":"#f59e0b",color:migrating?"#9ca3af":"#fff",border:"none",borderRadius:6,padding:"8px 16px",fontSize:12,fontWeight:700,cursor:migrating?"not-allowed":"pointer"}}>
          {migrating?"移行中…":"移行を開始する"}
        </button>
        {migrateLog.length>0 && (
          <div style={{marginTop:10,background:"#fafafa",border:"1px solid #d1d5db",borderRadius:6,padding:8,maxHeight:200,overflow:"auto"}}>
            {migrateLog.map((l,i)=><div key={i} style={{fontSize:10,color:"#111827",fontFamily:"monospace",marginBottom:2}}>{l}</div>)}
          </div>
        )}
      </div>
      <div style={{fontSize:10,color:"#6b7280",letterSpacing:"0.1em",marginBottom:12}}>■ 月次バックアップ（毎月1日自動実行）</div>
      {bkLoading?<div style={{color:"#6b7280",textAlign:"center",padding:20}}>読み込み中...</div>:
      years.length===0?<div style={{color:"#6b7280",textAlign:"center",padding:20}}>バックアップがありません</div>:
      years.map(y=>(
        <div key={y} style={{marginBottom:12}}>
          <button onClick={()=>setOpenYear(openYear===y?null:y)} style={{width:"100%",background:"#fafafa",border:"1px solid #e5e7eb",borderRadius:8,padding:"12px 14px",textAlign:"left",cursor:"pointer",color:"#111827",fontSize:14,fontWeight:700}}>
            {openYear===y?"▼":"▶"} {y}年度 <span style={{fontSize:11,color:"#6b7280",fontWeight:400}}>({bkups.filter(b=>b.fiscalYear===y).length}テーブル)</span>
          </button>
          {openYear===y&&(
            <div style={{background:"#fafafa",border:"1px solid #e5e7eb",borderTop:"none",borderRadius:"0 0 8px 8px",padding:8}}>
              {bkups.filter(b=>b.fiscalYear===y).map(b=>(
                <div key={b.id} style={{marginBottom:4}}>
                  <button onClick={()=>setOpenTable(openTable===b.id?null:b.id)} style={{width:"100%",display:"flex",justifyContent:"space-between",background:"#fafafa",border:"1px solid #d1d5db",borderRadius:6,padding:"8px 12px",cursor:"pointer",color:"#374151",fontSize:11}}>
                    <span>{b.tableName}</span>
                    <span style={{color:"#6b7280"}}>{Array.isArray(b.data)?b.data.length:0}件 · {new Date(b.backedUpAt).toLocaleDateString("ja-JP")}</span>
                  </button>
                  {openTable===b.id&&(
                    <div style={{background:"#fafafa",border:"1px solid #d1d5db",borderTop:"none",borderRadius:"0 0 6px 6px",padding:8,maxHeight:300,overflow:"auto"}}>
                      <pre style={{fontSize:10,color:"#6b7280",whiteSpace:"pre-wrap",wordBreak:"break-all",margin:0}}>{JSON.stringify(b.data,null,2).slice(0,5000)}{JSON.stringify(b.data,null,2).length>5000?"...(省略)":""}</pre>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// [2026-07-01] 予算消化バーに外注費分をオレンジ表示。outsource=外注人工。
//   人工消化%=actual÷target、外注消化%=outsource÷target。合計>100で赤。
function NinkuBar({ actual, target, outsource=0 }) {
  const ninkuPct = target>0?Math.round((actual/target)*100):0;
  const outPct = target>0?Math.round((outsource/target)*100):0;
  const totalPct = ninkuPct + outPct;
  const over = totalPct>100;
  const ninkuW = Math.min(ninkuPct,100);
  const outW = Math.min(outPct, Math.max(0,100-ninkuW));
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:11}}>
        <span style={{color:"#111827"}}>人工進捗</span>
        <span style={{fontFamily:"'JetBrains Mono',monospace",color:over?"#ef4444":"#374151"}}>{actual}/{target}（計{totalPct}%）{over&&<span style={{color:"#ef4444",marginLeft:4}}>超過!</span>}</span>
      </div>
      <div style={{display:"flex",height:8,background:"#e5e7eb",borderRadius:4,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${ninkuW}%`,background:over?"#ef4444":"#22c55e",transition:"width 0.4s"}} />
        <div style={{height:"100%",width:`${outW}%`,background:over?"#ef4444":"#f97316",transition:"width 0.4s"}} />
      </div>
      <div style={{marginTop:4,fontSize:10}}>
        <span style={{color:over?"#ef4444":"#22c55e",fontWeight:700}}>人工 {ninkuPct}%</span>
        {outsource>0&&<span style={{color:"#9ca3af"}}> / </span>}
        {outsource>0&&<span style={{color:over?"#ef4444":"#f97316",fontWeight:700}}>外注 {outPct}%(見込み)</span>}
      </div>
    </div>
  );
}

function ProgressBar({ value }) {
  const pct = Math.min(Math.max(value||0,0),100);
  const c = pct>=80?"#22c55e":pct>=50?"#f59e0b":"#ef4444";
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:11}}>
        <span style={{color:"#111827"}}>工事進捗</span>
        <span style={{fontFamily:"'JetBrains Mono',monospace",color:c,fontWeight:700}}>{pct}%</span>
      </div>
      <div style={{height:8,background:"#e5e7eb",borderRadius:4,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${c}88,${c})`,transition:"width 0.4s"}} />
      </div>
    </div>
  );
}

// [2026-06-16] 追加工事（受注）エディタ（案件レベル・収入側）
// [2026-06-17] 外注費とは分離。1件ごとに 工事名・見積金額・受注額・掛率(受注÷見積)。
// 受注額合計は請負金額に加算して「トータル受注額」として表示（外注費には連動しない）。
// onChange(newRowsForProject): 親が global additionalEstimates を更新する。
function AdditionalEstimatesEditor({ projectId, estimates, contractAmount, showToast, onChange }) {
  const baseContract = Number(contractAmount) || 0;
  // 行編集用ローカルミラー（idの集合が変わった時だけ props から再同期＝打鍵中は上書きしない）
  const [rows, setRows] = React.useState(estimates);
  const [busy, setBusy] = React.useState(false);
  const [draft, setDraft] = React.useState({ name:"", estimatedAmount:"", contractAmount:"" });
  const idsKey = estimates.map(e=>e.id).join(",");
  React.useEffect(()=>{ setRows(estimates); }, [idsKey]);

  const sum = rows.reduce((s,e)=>s+(Number(e.contractAmount)||0),0);
  const totalContract = baseContract + sum;
  const numIS = { width:"100%", background:"#fff", border:"1px solid #d1d5db", borderRadius:6, padding:"7px 8px", color:"#111827", fontSize:13, fontFamily:"'JetBrains Mono',monospace", textAlign:"right", boxSizing:"border-box", outline:"none" };
  const txtIS = { ...numIS, textAlign:"left", fontFamily:"'Noto Sans JP',sans-serif" };

  const add = async () => {
    if(!draft.name.trim()){ showToast("会社名・名前を入力してください"); return; }
    setBusy(true);
    const e={ id:uid(), projectId, name:draft.name.trim(), estimatedAmount:Number(draft.estimatedAmount)||0, contractAmount:Number(draft.contractAmount)||0, createdAt:new Date().toISOString() };
    const res=await insertAdditionalEstimate(e);
    setBusy(false);
    if(!res||!res.ok){ showToast("⚠ 追加見積の登録に失敗: "+(getLastApiError()||"")); return; }
    const newRows=[...rows,e];
    setRows(newRows);
    setDraft({ name:"", estimatedAmount:"", contractAmount:"" });
    onChange(newRows);
  };

  const saveRow = async (row) => {
    setBusy(true);
    const res=await updateAdditionalEstimate(row.id, { name:row.name, estimatedAmount:Number(row.estimatedAmount)||0, contractAmount:Number(row.contractAmount)||0 });
    setBusy(false);
    if(!res||!res.ok){ showToast("⚠ 追加見積の更新に失敗: "+(getLastApiError()||"")); return; }
    onChange(rows);
  };

  const del = async (id) => {
    setBusy(true);
    const res=await deleteAdditionalEstimateDB(id);
    setBusy(false);
    if(!res||!res.ok){ showToast("⚠ 追加見積の削除に失敗: "+(getLastApiError()||"")); return; }
    const newRows=rows.filter(r=>r.id!==id);
    setRows(newRows);
    onChange(newRows);
  };

  const editLocal=(id,field,val)=>setRows(rs=>rs.map(r=>r.id===id?{...r,[field]:val}:r));

  return (
    <div style={{background:"#f8fafc",border:"1px solid #cbd5e1",borderRadius:8,padding:"10px 12px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:11,fontWeight:700,color:"#0284c7"}}>■ 追加工事（受注）</span>
        <span style={{fontSize:9,color:"#64748b"}}>受注額合計 → 請負金額に加算</span>
      </div>
      {/* 既存行 */}
      {rows.length>0 && (
        <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:8}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 76px 76px 42px 28px",gap:6,fontSize:9,color:"#94a3b8",padding:"0 2px"}}>
            <span>名前</span><span style={{textAlign:"right"}}>見積金額</span><span style={{textAlign:"right"}}>受注額</span><span style={{textAlign:"right"}}>掛率</span><span></span>
          </div>
          {rows.map(r=>{
            // [2026-06-17] 掛率 = 受注額 ÷ 見積金額（小数2桁）
            const est=Number(r.estimatedAmount)||0, con=Number(r.contractAmount)||0;
            const mk=est>0?con/est:null;
            return (
            <div key={r.id} style={{display:"grid",gridTemplateColumns:"1fr 76px 76px 42px 28px",gap:6,alignItems:"center"}}>
              <input type="text" value={r.name} disabled={busy} onChange={e=>editLocal(r.id,"name",e.target.value)} onBlur={()=>saveRow(r)} placeholder="工事名" style={txtIS}/>
              <input type="number" value={r.estimatedAmount} disabled={busy} onWheel={e=>e.currentTarget.blur()} onChange={e=>editLocal(r.id,"estimatedAmount",e.target.value)} onBlur={()=>saveRow(r)} placeholder="0" style={numIS}/>
              <input type="number" value={r.contractAmount} disabled={busy} onWheel={e=>e.currentTarget.blur()} onChange={e=>editLocal(r.id,"contractAmount",e.target.value)} onBlur={()=>saveRow(r)} placeholder="0" style={{...numIS,borderColor:"#a78bfa66",color:"#7c3aed",fontWeight:700}}/>
              <span style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:700,color:mk===null?"#cbd5e1":mk>=0.9?"#16a34a":mk>=0.8?"#f59e0b":"#ef4444"}}>{mk===null?"—":mk.toFixed(2)}</span>
              <button type="button" disabled={busy} onClick={()=>del(r.id)} title="削除" style={{background:"#fef2f2",color:"#ef4444",border:"1px solid #ef444433",borderRadius:6,width:28,height:30,cursor:busy?"not-allowed":"pointer",fontSize:13,padding:0}}>×</button>
            </div>
            );
          })}
        </div>
      )}
      {/* 新規入力行 */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 76px 76px 42px 28px",gap:6,alignItems:"center"}}>
        <input type="text" value={draft.name} disabled={busy} onChange={e=>setDraft(f=>({...f,name:e.target.value}))} placeholder="工事名（例: 荒井ラッキング）" style={txtIS}/>
        <input type="number" value={draft.estimatedAmount} disabled={busy} onWheel={e=>e.currentTarget.blur()} onChange={e=>setDraft(f=>({...f,estimatedAmount:e.target.value}))} placeholder="見積金額" style={numIS}/>
        <input type="number" value={draft.contractAmount} disabled={busy} onWheel={e=>e.currentTarget.blur()} onChange={e=>setDraft(f=>({...f,contractAmount:e.target.value}))} placeholder="受注額" style={numIS}/>
        <span/>
        <button type="button" disabled={busy} onClick={add} title="追加" style={{background:"#ecfdf5",color:"#16a34a",border:"1px solid #16a34a44",borderRadius:6,width:28,height:30,cursor:busy?"not-allowed":"pointer",fontSize:16,fontWeight:700,padding:0,lineHeight:1}}>＋</button>
      </div>
      {/* [2026-06-17] 元の請負金額 + 追加受注合計 = トータル受注（収入側） */}
      {sum>0 && (
        <div style={{borderTop:"1px solid #e2e8f0",marginTop:8,paddingTop:8,fontSize:11,display:"flex",flexDirection:"column",gap:3,fontFamily:"'JetBrains Mono',monospace"}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <span style={{color:"#64748b",fontFamily:"'Noto Sans JP',sans-serif"}}>元の請負金額</span>
            <span style={{color:"#6b7280"}}>¥{baseContract.toLocaleString()}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <span style={{color:"#64748b",fontFamily:"'Noto Sans JP',sans-serif"}}>追加受注合計</span>
            <span style={{color:"#0284c7",fontWeight:700}}>＋¥{sum.toLocaleString()}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",borderTop:"1px solid #e2e8f0",paddingTop:3}}>
            <span style={{color:"#0f172a",fontWeight:700,fontFamily:"'Noto Sans JP',sans-serif"}}>トータル受注</span>
            <span style={{color:"#0284c7",fontWeight:700,fontSize:13}}>¥{totalContract.toLocaleString()}</span>
          </div>
        </div>
      )}
    </div>
  );
}
