<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>シンセイ工業 現場管理</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="shared.js"></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f97316">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="現場管理">
  <link rel="apple-touch-icon" href="/icon-192_v4.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="dist/user.js"></script>
  <script>
    // [2026-04-28] /user?reset=... で強制リセット（管理者がリンク送る用）
    (async()=>{
      try{
        if(new URLSearchParams(location.search).has('reset')){
          if('serviceWorker' in navigator){
            const regs = await navigator.serviceWorker.getRegistrations();
            for(const r of regs) await r.unregister();
          }
          if(typeof caches!=='undefined'){
            const names = await caches.keys();
            for(const n of names) await caches.delete(n);
          }
          try{ localStorage.clear(); }catch(_){}
          try{ sessionStorage.clear(); }catch(_){}
          // reset query を消して再ロード
          location.replace('/user');
          return;
        }
      }catch(_){}
    })();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          setInterval(() => reg.update().catch(()=>{}), 60*60*1000);
          reg.addEventListener('updatefound', () => {
            const newSW = reg.installing;
            if (!newSW) return;
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                newSW.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch(() => {});
        let reloaded = false;
        navigator.serviceWorker.addEventListener('message', e => {
          if (e.data?.type === 'SW_UPDATED' && !reloaded) {
            reloaded = true;
            setTimeout(() => window.location.reload(), 500);
          }
        });
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!reloaded) { reloaded = true; window.location.reload(); }
        });
      });
    }
  </script>
</body>
</html>
